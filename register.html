<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>注册 · 四级备考教练</title>
<style>
  *{box-sizing:border-box}
  :root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f6f7f5;--card:#fff;--accent:#0f766e;--accent-d:#115e59;--warn:#b45309;--ok:#15803d}
  html,body{height:100%}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:
    radial-gradient(1200px 600px at 12% -10%, #e8f0ec 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #eef1f6 0%, transparent 55%), var(--bg);
    color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:420px}
  .brand{display:flex;align-items:center;gap:10px;margin:0 0 18px 4px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#0ea5a4);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:.5px}
  .brand b{font-size:15px;letter-spacing:.3px}
  .brand span{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px 22px;
    box-shadow:0 10px 30px rgba(15,23,42,.06)}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.3px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.7}
  label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}
  input{width:100%;padding:11px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;
    background:#fbfbfa;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.12);background:#fff}
  input.code{letter-spacing:2px;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace}
  button{width:100%;margin-top:20px;padding:11px 14px;font-size:14px;font-weight:600;color:#fff;
    background:var(--accent);border:0;border-radius:10px;cursor:pointer;transition:background .15s}
  button:hover{background:var(--accent-d)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{min-height:20px;font-size:12.5px;margin-top:12px;line-height:1.6}
  .msg.err{color:#b91c1c}
  .msg.ok{color:var(--ok)}
  .msg.warn{color:var(--warn)}
  .foot{margin-top:16px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .foot a{color:var(--accent);text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .hint{margin-top:14px;font-size:11.5px;color:#9ca3af;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">C4</div>
    <div><b>四级备考教练</b><br><span>私人学习空间</span></div>
  </div>

  <div class="card">
    <h1>注册</h1>
    <p class="sub">注册需要一次性邀请码（由管理员在后台生成）。每个邀请码只能使用一次。</p>
    <form id="f" novalidate>
      <label for="u">用户名（3-20 位字母、数字或下划线）</label>
      <input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="e">邮箱</label>
      <input id="e" type="email" autocomplete="email" spellcheck="false" required>
      <label for="p">密码（8 位以上，建议含字母与数字）</label>
      <input id="p" type="password" autocomplete="new-password" required>
      <label for="p2">确认密码</label>
      <input id="p2" type="password" autocomplete="new-password" required>
      <label for="c">邀请码</label>
      <input id="c" class="code" autocomplete="off" spellcheck="false" placeholder="例如 A1B2C3D4E5F6" required>
      <button id="btn" type="submit">创建账号</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">
      <span>已有账号？</span>
      <a href="login.html">返回登录</a>
    </div>
  </div>
  <p class="hint">注册不会自动登录；创建完成后请用刚设置的密码登录。</p>
</div>

<script src="./config.js"></script>
<script>
(function () {
  "use strict";
  var API_BASE = String((window.CET4_CONFIG || {}).API_BASE || "").trim().replace(/\/+$/, "");
  var READY = !!API_BASE && !/REPLACE|YOUR-TUNNEL|example\.com/i.test(API_BASE);
  var TOKEN_KEY = "cet4coach.token.v1";
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), btn = $("btn");
  var u = $("u"), e = $("e"), p = $("p"), p2 = $("p2"), c = $("c");

  function setMsg(t, k) { msg.className = "msg" + (k ? " " + k : ""); msg.textContent = t || ""; }
  function authHeaders() {
    var t = "";
    try { t = localStorage.getItem(TOKEN_KEY) || ""; } catch (err) { t = ""; }
    return t ? { "Authorization": "Bearer " + t } : {};
  }

  if (!READY) {
    setMsg("尚未配置后端地址，请先编辑 config.js 中的 API_BASE。", "warn");
    btn.disabled = true;
  } else {
    fetch(API_BASE + "/api/verify", { credentials: "include", headers: authHeaders() }).then(function (r) {
      if (r.status === 200) location.replace("index.html");
    }).catch(function () {});
  }

  $("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var username = u.value.trim();
    var email = e.value.trim();
    var password = p.value;
    var code = c.value.trim().toUpperCase();

    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return setMsg("用户名需为 3-20 位字母、数字或下划线。", "err");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setMsg("邮箱格式不正确。", "err");
    if (password.length < 8) return setMsg("密码至少 8 位。", "err");
    if (password !== p2.value) return setMsg("两次输入的密码不一致。", "err");
    if (!code) return setMsg("请填写邀请码。", "err");

    btn.disabled = true;
    setMsg("正在提交…");
    fetch(API_BASE + "/api/register", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, email: email, password: password, inviteCode: code })
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (res.status === 200) {
          setMsg("注册成功，正在前往登录…", "ok");
          location.replace("login.html?registered=1&u=" + encodeURIComponent(username));
          return;
        }
        btn.disabled = false;
        var m = (data && data.message) || "注册失败（" + res.status + "）";
        if (res.status === 403) setMsg(m + "（请向管理员确认邀请码是否有效）", "err");
        else if (res.status === 429) setMsg("尝试过于频繁，请稍后再试。", "warn");
        else setMsg(m, "err");
      });
    }).catch(function () {
      btn.disabled = false;
      setMsg("网络异常，请检查连接后重试。", "err");
    });
  });
})();
</script>
</body>
</html>
