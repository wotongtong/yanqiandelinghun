<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 四级备考教练</title>
<style>
  :root{--ink:#18181b;--muted:#6b7280;--accent:#0f766e}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:#f6f7f8;color:var(--ink)}
  .box{max-width:420px;text-align:center;background:#fff;border:1px solid #e6e7ea;border-radius:16px;padding:30px 28px}
  h1{font-size:19px;margin:0 0 10px}
  p{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 18px}
  a{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <h1>页面不存在</h1>
    <p>你访问的地址没有对应的页面，正在返回首页…</p>
    <a id="back" href="./">返回首页</a>
  </div>
<script>
(function () {
  // GitHub Pages 项目站点形如 /<仓库名>/...，取第一段作为站点根
  var m = location.pathname.match(/^\/[^\/]+\//);
  var root = m ? m[0] : "/";
  document.getElementById("back").setAttribute("href", root);
  setTimeout(function () { location.replace(root); }, 1200);
})();
</script>
</body>
</html>
