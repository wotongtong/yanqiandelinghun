<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四级备考领航教练 · CET-4 Coach</title>
<style>
/* ============ 设计系统：主题变量 ============ */
:root{
  /* —— 品牌 / 功能色：深青体系，去掉紫调与光晕 —— */
  --brand:#0f766e;
  --brand-2:#0d9488;
  --brand-soft:#e8f5f3;
  --accent:#b45309;
  --accent-soft:#fdf6ec;
  --ok:#15803d;
  --ok-soft:#eef7f0;
  --warn:#b45309;
  --warn-soft:#fdf6ec;
  --bad:#dc2626;
  --bad-soft:#fdf2f2;
  --info:#0369a1;
  --info-soft:#eef6fb;

  /* —— 中性基：Zinc 调，避免纯黑纯灰 —— */
  --bg:#f6f7f8;
  --bg-2:#ffffff;
  --card:#ffffff;
  --card-2:#fafbfb;
  --text:#18181b;
  --text-2:#52525b;
  --text-3:#8b8f98;
  --line:#e6e7ea;
  --line-2:#f0f1f3;

  /* —— 深度：默认靠 1px 描边，阴影只在需要抬升时用 —— */
  --sh-1:0 1px 2px rgba(24,24,27,.05);
  --sh-2:0 1px 3px rgba(24,24,27,.06),0 12px 28px -18px rgba(24,24,27,.2);
  --shadow:var(--sh-2);
  --shadow-sm:var(--sh-1);

  /* —— 形状 —— */
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:16px;
  --r-sm:8px;
  --r:12px;
  --r-lg:16px;

  /* —— 间距标尺 —— */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;
  --sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:40px;
  --gap:16px;
  --pad:18px;

  /* —— 字号标尺 —— */
  --fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-15:15px;
  --fs-17:17px;--fs-20:20px;--fs-26:26px;--fs-34:34px;

  --maxw:1240px;
  --topbar-h:58px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
}
html[data-theme="dark"]{
  --brand:#2dd4bf;
  --brand-2:#14b8a6;
  --brand-soft:#0f2b28;
  --accent:#fbbf24;
  --accent-soft:#2a2110;
  --ok:#4ade80;
  --ok-soft:#0f2a18;
  --warn:#fbbf24;
  --warn-soft:#2a2110;
  --bad:#f87171;
  --bad-soft:#2b1517;
  --info:#38bdf8;
  --info-soft:#0e2233;

  --bg:#0c0e0f;
  --bg-2:#141719;
  --card:#16191b;
  --card-2:#1b1f21;
  --text:#eceef0;
  --text-2:#a2a8ae;
  --text-3:#767c83;
  --line:#24282b;
  --line-2:#1f2325;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 3px rgba(0,0,0,.4),0 14px 30px -20px rgba(0,0,0,.8);
  --shadow:var(--sh-2);
  --shadow-sm:var(--sh-1);
}

/* ============ 基础重置 ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
button{font-family:inherit}
a{color:var(--brand);text-decoration:none}
img{max-width:100%}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--brand);color:#fff}

/* ============ 顶部导航 ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:var(--maxw);margin:0 auto;padding:10px 18px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand .logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;font-size:15px;font-weight:800;box-shadow:0 4px 12px -4px var(--brand);
}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--text-3);letter-spacing:.6px}
.nav{display:flex;gap:2px;margin-left:8px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0;background:transparent;color:var(--text-2);cursor:pointer;
  padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;
  transition:.18s;
}
.nav button:hover{background:var(--brand-soft);color:var(--brand)}
.nav button.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px -4px var(--brand)}
.top-acts{display:flex;gap:8px;align-items:center}

/* ============ 通用控件 ============ */
.btn{
  border:1px solid var(--line);background:var(--bg-2);color:var(--text);
  padding:9px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.18s;box-shadow:var(--shadow-sm);
}
.btn:hover{transform:translateY(-1px);border-color:var(--brand)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px var(--brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--brand-soft);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 26px;font-size:16px;border-radius:12px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.block{width:100%;justify-content:center}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);
  cursor:pointer;display:grid;place-items:center;color:var(--text-2);transition:.18s;font-size:16px;
}
.iconbtn:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-1px)}
.iconbtn.danger:hover{color:#dc2626;border-color:#dc2626}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--pad);box-shadow:var(--sh-1);
}
.card.pad-lg{padding:calc(var(--pad) + 6px)}
.card-title{font-size:var(--fs-15);font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3);letter-spacing:-.1px}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:12px}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.center{text-align:center}
.row{display:flex;gap:12px}
.row.wrap{flex-wrap:wrap}
.row.mid{align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mt-l{margin-top:24px}
.mb{margin-bottom:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);
}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.plain{background:var(--card-2);color:var(--text-2)}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text-2)}
.input,textarea.input,select.input{
  width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg-2);outline:none;transition:.18s;font-size:14px;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{resize:vertical;min-height:96px;line-height:1.7}
.hint{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.6}

/* ============ 布局：流体栅格 + 密度标尺 ============ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--sp-6) var(--sp-5) var(--sp-8)}
.grid{display:grid;gap:var(--gap);grid-auto-rows:min-content}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* 自适应网格：按可用宽度自动定列，宽屏一屏承载更多内容 */
.gauto{grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--gmin,240px)),1fr))}
.gauto-sm{--gmin:190px}
.gauto-md{--gmin:330px}
.view{display:none;animation:fade .32s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 首页 Hero ============ */
.hero{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 55%,#8b5cf6 100%);
  border-radius:var(--radius-lg);padding:44px 36px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 24px 48px -24px var(--brand);
}
.hero:after{
  content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:rgba(255,255,255,.12);
}
.hero:before{
  content:"";position:absolute;right:60px;bottom:-120px;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero h1{font-size:clamp(24px,4vw,36px);font-weight:900;letter-spacing:-.5px;position:relative;z-index:1}
.hero p{opacity:.94;margin-top:10px;max-width:620px;position:relative;z-index:1;font-size:15px}
.hero .btns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:var(--brand);border-color:transparent;font-weight:800}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.26)}

.step-card{position:relative;padding-top:26px}
.step-num{
  position:absolute;top:-14px;left:20px;width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 6px 14px -6px var(--brand);
}

/* ============ 诊断 ============ */
.diag-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden;flex:1;min-width:140px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .35s ease;border-radius:999px}
.timer{
  font-family:var(--mono);font-weight:800;font-size:15px;padding:6px 12px;border-radius:9px;
  background:var(--card-2);border:1px solid var(--line);min-width:74px;text-align:center;
}
.timer.hot{color:var(--bad);border-color:var(--bad)}

.qtext{font-size:16.5px;line-height:1.85;margin-bottom:6px}
.qtext.en{font-size:16px;line-height:1.9}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border:1.5px solid var(--line);
  border-radius:12px;cursor:pointer;margin-bottom:9px;transition:.16s;background:var(--card);
}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .key{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:13px;
}
.opt.sel .key{background:var(--brand);color:#fff;border-color:transparent}
.opt.right .key{background:var(--ok);color:#fff;border-color:transparent}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:transparent}
.opt .txt{flex:1;font-size:14.5px}

.passage{
  background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  font-size:14.5px;line-height:1.95;max-height:340px;overflow:auto;
}
.blank{display:inline-block;min-width:74px;border-bottom:1.5px solid var(--brand);text-align:center;font-weight:800;color:var(--brand)}

.audioplay{
  display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px dashed var(--line);
  border-radius:12px;padding:14px 16px;
}
.wave{display:flex;gap:3px;align-items:flex-end;height:26px}
.wave i{width:3px;background:var(--brand);border-radius:2px;opacity:.35}
.wave.on i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave i:nth-child(1){height:30%}.wave i:nth-child(2){height:60%}.wave i:nth-child(3){height:100%}
.wave i:nth-child(4){height:45%}.wave i:nth-child(5){height:75%}.wave i:nth-child(6){height:35%}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

.explain{
  background:var(--info-soft);border-left:3px solid var(--info);border-radius:8px;
  padding:12px 15px;font-size:13.5px;line-height:1.8;margin-top:12px;
}
.explain b{color:var(--info)}

/* ============ 结果页 ============ */
.score-hero{
  display:flex;gap:30px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  border-radius:var(--radius-lg);padding:30px 32px;box-shadow:0 24px 48px -24px var(--brand);
}
.big-score{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px}
.big-score small{font-size:20px;font-weight:700;opacity:.8;margin-left:6px}
.level-tag{
  display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.4);font-weight:800;font-size:14px;backdrop-filter:blur(4px);
}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat .k{font-size:12px;color:var(--text-3);font-weight:700}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s ease}

/* ============ 计划 ============ */
.stage{position:relative;padding-left:38px;padding-bottom:6px}
.stage:before{content:"";position:absolute;left:11px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.stage:last-child:before{display:none}
.stage .dot{
  position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);border:2.5px solid var(--brand);display:grid;place-items:center;
  font-size:11px;font-weight:800;color:var(--brand);z-index:1;
}
.stage.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.task{
  display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;
  cursor:pointer;transition:.15s;border:1px solid transparent;
}
.task:hover{background:var(--card-2);border-color:var(--line)}
.task input{width:17px;height:17px;margin-top:3px;accent-color:var(--brand);cursor:pointer;flex:0 0 auto}
.task .txt{font-size:14px;flex:1}
.task.done .txt{text-decoration:line-through;color:var(--text-3)}

/* ============ 练习 / 错题本 ============ */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:var(--fs-13);font-weight:600;transition:.16s;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);color:#fff;border-color:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:9px 12px;color:var(--text-3);font-size:12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty .big{font-size:40px;margin-bottom:8px;opacity:.6}

/* ============ AI 题库更新 ============ */
.logitem{
  margin-top:8px;padding:9px 12px;border-left:3px solid var(--line);border-radius:8px;
  background:var(--card-2);font-size:13.5px;line-height:1.7;
}
.logitem.ok{border-left-color:var(--ok)}
.logitem.bad{border-left-color:var(--bad);color:var(--bad)}
details summary{cursor:pointer;padding:6px 2px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";color:var(--brand);font-weight:800}
details[open] summary:before{content:"▾ "}

/* ============ 工具箱 ============ */
.tool-out{
  background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;min-height:60px;
}
.loader{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
mark{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:3px;font-weight:700}

/* ============ 提示条 / 模态 ============ */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg-2);padding:12px 22px;border-radius:12px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transition:.3s;
  max-width:90vw;text-align:center;
}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.55);backdrop-filter:blur(3px);z-index:150;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow:auto;animation:fade .25s ease}

/* ============ 页脚 ============ */
.foot{text-align:center;color:var(--text-3);font-size:12.5px;padding:26px 18px;border-top:1px solid var(--line);margin-top:30px;line-height:1.9}

/* ============ 改版 v2 · 全局导览：顶栏分组 / 底部标签栏 ============ */
.topbar-in{padding:var(--sp-2) var(--sp-5);gap:var(--sp-3);min-height:var(--topbar-h)}
.nav{margin-left:var(--sp-2)}
.nav button{position:relative;padding:7px 12px;font-size:var(--fs-13)}
.nav button[data-group]{margin-left:var(--sp-5)}
.nav button[data-group]:before{
  content:"";position:absolute;left:calc(var(--sp-5) / -2);top:50%;margin-top:-7px;
  width:1px;height:14px;background:var(--line);border-radius:1px;
}

.tabbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{display:flex;max-width:620px;margin:0 auto}
.tabbar button{
  flex:1;min-height:44px;border:0;background:transparent;cursor:pointer;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 4px;font-size:var(--fs-11);font-weight:700;transition:.16s;
}
.tabbar button .ti{font-size:19px;line-height:1}
.tabbar button.on{color:var(--brand)}
.tabbar button.on .ti{transform:translateY(-1px)}

/* ============ 改版 v2 · 页头（二级导航）============ */
.page-head{margin-bottom:var(--sp-5)}
.crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-3);margin-bottom:var(--sp-2)}
.crumb b{color:var(--brand);font-weight:700}
.crumb i{font-style:normal;opacity:.45}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap}
.ph-title{font-size:clamp(19px,2vw,23px);font-weight:800;letter-spacing:-.4px;line-height:1.25}
.ph-desc{font-size:var(--fs-13);color:var(--text-2);margin-top:5px;max-width:72ch;line-height:1.7}
.ph-side{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.ph-kpi{
  display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:999px;white-space:nowrap;
  background:var(--card);border:1px solid var(--line);font-size:var(--fs-12);color:var(--text-2);
}
.ph-kpi b{font-family:var(--mono);font-size:var(--fs-15);font-weight:800;color:var(--text)}

/* ============ 改版 v2 · 分段导航 ============ */
.segmented{
  display:flex;gap:4px;padding:4px;border-radius:var(--r);background:var(--card-2);
  border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
}
.segmented::-webkit-scrollbar{display:none}
.segmented button{
  border:0;background:transparent;color:var(--text-2);cursor:pointer;white-space:nowrap;
  padding:8px 14px;border-radius:9px;font-size:var(--fs-13);font-weight:700;transition:.18s;
  display:inline-flex;align-items:center;gap:6px;
}
.segmented button:hover{color:var(--brand)}
.segmented button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh-1)}
html[data-theme="dark"] .segmented button.on{background:var(--brand-soft)}
.seg-stick{position:sticky;top:var(--topbar-h);z-index:45;padding:var(--sp-3) 0;background:linear-gradient(var(--bg) 68%,transparent)}
.seg-bar{display:flex;align-items:center;gap:var(--sp-3);justify-content:space-between}
.seg-bar .segmented{flex:1;min-width:0}
.seg-now{font-size:var(--fs-12);color:var(--text-3);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg-now b{color:var(--text-2);font-weight:700}
@media(max-width:767px){.seg-now{display:none}}

/* ============ 改版 v2 · KPI / 行式列表 / 磁贴 ============ */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:var(--fs-11);font-weight:800;color:var(--text-3);letter-spacing:.4px}
.kpi .v{font-size:var(--fs-20);font-weight:800;font-family:var(--mono);letter-spacing:-.5px;margin-top:2px;line-height:1.15}
.kpi .v small{font-size:var(--fs-12);font-weight:700;color:var(--text-3);margin-left:3px}
.kpi .d{font-size:var(--fs-11);color:var(--text-3);margin-top:3px}

.list{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.list-row{display:flex;align-items:center;gap:var(--sp-3);padding:11px 14px;border-top:1px solid var(--line-2);transition:.16s}
.list-row:first-child{border-top:0}
.list-row:hover{background:var(--card-2)}
.list-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);font-size:17px;flex:0 0 auto}
.list-main{flex:1;min-width:0}
.list-t{font-size:var(--fs-14);font-weight:700}
.list-d{font-size:var(--fs-12);color:var(--text-3);margin-top:2px}
.list-tail{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto}

.tile{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);cursor:pointer;transition:.18s;text-align:left;width:100%;font-family:inherit}
.tile:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--sh-2)}
.tile .ti{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);font-size:19px;flex:0 0 auto}
.tile .tt{font-size:var(--fs-14);font-weight:700;color:var(--text)}
.tile .td{font-size:var(--fs-12);color:var(--text-3);margin-top:1px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ============ 改版 v2 · 仪表盘 Hero / 分数条 ============ */
.dash-hero{
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--sp-6);align-items:center;
  background:linear-gradient(150deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:var(--r-lg);
  padding:var(--sp-6);box-shadow:0 18px 44px -30px var(--brand);position:relative;overflow:hidden;
}
.dash-hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.dash-hero>*{position:relative;z-index:1}
.dash-hero h1{font-size:clamp(21px,2.3vw,29px);font-weight:800;letter-spacing:-.7px;line-height:1.22}
.dash-hero p{font-size:var(--fs-14);opacity:.93;margin-top:8px;max-width:50ch;line-height:1.7}
.dash-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:var(--sp-5)}
.dash-hero .btn{background:#fff;color:var(--brand);border-color:transparent;font-weight:800}
.dash-hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.34)}
.dash-hero .btn.ghost:hover{background:rgba(255,255,255,.24)}
.dash-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dash-kpi{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:var(--r);padding:10px 12px}
.dash-kpi .k{font-size:var(--fs-11);opacity:.85;font-weight:700}
.dash-kpi .v{font-size:var(--fs-20);font-weight:800;font-family:var(--mono);letter-spacing:-.5px;margin-top:2px}
.dash-kpi .d{font-size:var(--fs-11);opacity:.8;margin-top:1px}
.dash-kpi .v small{font-size:var(--fs-11);font-weight:600;opacity:.78;margin-left:2px}

.score-hero{
  display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:var(--sp-6);align-items:center;
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;
  border-radius:var(--r-lg);padding:var(--sp-6);box-shadow:0 18px 44px -30px var(--brand);
}
.big-score{font-size:clamp(40px,5vw,54px);font-weight:800;line-height:1;letter-spacing:-2px;font-family:var(--mono)}
.hero{
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);border-radius:var(--r-lg);
  padding:var(--sp-6);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 44px -30px var(--brand);
}
.hero h1{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.6px;position:relative;z-index:1}
.hero p{opacity:.93;margin-top:8px;max-width:60ch;position:relative;z-index:1;font-size:var(--fs-14)}
.hero .btns{margin-top:var(--sp-5);display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}

/* ============ 改版 v2 · 会话双栏 / 答题卡 / 锚点导航 ============ */
.session{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:var(--sp-5);align-items:start}
.sheet{position:sticky;top:calc(var(--topbar-h) + 16px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--sp-4)}
.sheet-h{font-size:var(--fs-11);font-weight:800;color:var(--text-3);letter-spacing:.4px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.sheet-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sheet-g b{height:28px;border-radius:7px;display:grid;place-items:center;font-size:var(--fs-12);font-weight:700;
  background:var(--card-2);border:1px solid var(--line);color:var(--text-3)}
.sheet-g b.done{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.sheet-g b.cur{background:var(--brand);border-color:transparent;color:#fff}
.sheet-legend{display:flex;gap:12px;margin-top:10px;font-size:var(--fs-11);color:var(--text-3);flex-wrap:wrap}
.sheet-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.stage-nav{display:flex;gap:8px;flex-wrap:wrap}
.stage-nav a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:var(--fs-12);font-weight:700;color:var(--text-2);cursor:pointer}
.stage-nav a:hover{border-color:var(--brand);color:var(--brand)}
.set-grid{display:grid;grid-template-columns:196px minmax(0,1fr);gap:var(--sp-5);align-items:start}
.set-nav{position:sticky;top:calc(var(--topbar-h) + 16px);display:flex;flex-direction:column;gap:2px}
.set-nav a{padding:8px 12px;border-radius:9px;font-size:var(--fs-13);font-weight:600;color:var(--text-2);cursor:pointer}
.set-nav a:hover{background:var(--card-2);color:var(--brand)}
.set-nav a.on{background:var(--card-2);color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)}
.set-pane{display:none}
.set-pane.on{display:block}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
/* —— 补充：折叠面板 / 磁贴按钮 / 答题卡交互 / 锚点定位 —— */
.step-card{transition:transform .18s,border-color .18s,box-shadow .18s}
.step-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile{text-align:left;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.tile .tile-txt{display:flex;flex-direction:column;min-width:0}
.fold{border-top:1px solid var(--line-2)}
.fold:first-child{border-top:0}
.fold summary{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 2px;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary:after{content:"＋";color:var(--text-3);font-weight:700;margin-left:auto}
.fold[open] summary:after{content:"－"}
.fold-t{font-weight:700;font-size:var(--fs-14)}
.fold-tag{font-size:var(--fs-12);color:var(--text-3);font-family:var(--mono)}
.fold-b{padding:2px 2px 14px}
.inline-fold summary{list-style:none;cursor:pointer;display:inline-flex}
.inline-fold summary::-webkit-details-marker{display:none}
.sheet-g b{cursor:pointer}
.sheet-g b.part{border-color:var(--brand);color:var(--brand)}
.stage{scroll-margin-top:calc(var(--topbar-h) + 12px)}
.set-main{min-width:0}

/* ============ 响应式：5 档（xl / lg / md / sm / xs）============ */
@media(min-width:1440px){
  :root{--maxw:1360px;--gap:18px;--pad:20px}
}
@media(max-width:1023px){
  .nav{display:none}
  .tabbar{display:block}
  .wrap{padding-bottom:var(--sp-7)}
  .foot{padding-bottom:calc(var(--sp-6) + 62px)}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .session{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .diag-side{order:-1}
  .diag-side .sheet{padding:10px 12px}
  .diag-side .sheet-legend{display:none}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .set-nav{position:static;flex-direction:row;flex-wrap:wrap}
  .dash-hero{grid-template-columns:minmax(0,1fr);gap:var(--sp-5)}
  .brand small{display:none}
}
@media(max-width:767px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:minmax(0,1fr)}
  .score-hero{grid-template-columns:minmax(0,1fr);gap:var(--sp-4)}
  .list-row{padding:10px 12px}
  .seg-stick{top:0}
}
@media(max-width:560px){
  :root{--gap:12px;--pad:14px;--topbar-h:54px}
  .wrap{padding:var(--sp-4) var(--sp-3) var(--sp-6)}
  .foot{padding-bottom:calc(var(--sp-5) + 62px)}
  .brand span{display:none}
  .topbar-in{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
  .btn{padding:9px 14px}
  .btn.lg{padding:12px 20px;font-size:var(--fs-15)}
  .card-title{font-size:var(--fs-14)}
  .segmented button{padding:8px 12px}
  .dash-hero{padding:var(--sp-5) var(--sp-4);border-radius:var(--r)}
  .score-hero{padding:var(--sp-5) var(--sp-4)}
  .ph-title{font-size:var(--fs-17)}
  .ph-row{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* =====================================================================
   视觉风格（Skin）：三套语言，可一键切换
   scholar 纸感学术 / blueprint 蓝图 / editorial 暖调杂志
   —— 皮肤层放在样式表末尾，以 html[data-skin] 覆盖基础令牌 ——
   ===================================================================== */
html[data-skin="scholar"]{
  --brand:#0f766e;--brand-2:#0d9488;--brand-soft:#e8f5f3;
  --bg:#f6f7f8;--bg-2:#ffffff;--card:#ffffff;--card-2:#fafbfb;
  --text:#18181b;--text-2:#52525b;--text-3:#8b8f98;
  --line:#e6e7ea;--line-2:#f0f1f3;
  --r-sm:8px;--r:12px;--r-lg:16px;--radius-sm:8px;--radius:12px;--radius-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.05);
  --sh-2:0 1px 3px rgba(24,24,27,.06),0 12px 28px -18px rgba(24,24,27,.2);
}

/* —— 2) 蓝图：冷蓝灰浅色、白卡 + 蓝色强调、高对比正文，长时间阅读清晰 —— */
html[data-skin="blueprint"]{
  --brand:#1d4ed8;--brand-2:#2563eb;--brand-soft:#e8effd;
  --accent:#b45309;--accent-soft:#fdf4e6;
  --ok:#15803d;--ok-soft:#e9f6ed;--warn:#b45309;--warn-soft:#fdf4e6;
  --bad:#b91c1c;--bad-soft:#fdeceb;--info:#0369a1;--info-soft:#e7f2fb;
  --bg:#eef2f8;--bg-2:#ffffff;--card:#ffffff;--card-2:#f6f9fd;
  --text:#0f172a;--text-2:#3f4c60;--text-3:#55627a;
  --line:#dbe3ee;--line-2:#eaf0f8;
  --r-sm:8px;--r:10px;--r-lg:14px;--radius-sm:8px;--radius:10px;--radius-lg:14px;
  --sh-1:0 1px 2px rgba(15,23,42,.06);
  --sh-2:0 2px 4px rgba(15,23,42,.05),0 16px 32px -24px rgba(15,23,42,.3);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
}
html[data-skin="blueprint"] body{
  background-image:
    linear-gradient(rgba(29,78,216,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(29,78,216,.04) 1px,transparent 1px);
  background-size:32px 32px;
  background-attachment:fixed;
}
html[data-skin="blueprint"] .topbar{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,23,42,.04)}
html[data-skin="blueprint"] .logo{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:9px;box-shadow:0 8px 18px -10px var(--brand)}
html[data-skin="blueprint"] .nav button{color:var(--text-2);border-radius:8px}
html[data-skin="blueprint"] .nav button.on{background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px #c9dbfa}
html[data-skin="blueprint"] .page-head{padding-bottom:12px;border-bottom:1px solid var(--line)}
html[data-skin="blueprint"] .crumb b{color:var(--brand)}
html[data-skin="blueprint"] .ph-kpi{background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--text-2)}
html[data-skin="blueprint"] .ph-kpi b{color:var(--brand)}
html[data-skin="blueprint"] .card{border:1px solid var(--line);background:#fff;box-shadow:var(--sh-1)}
html[data-skin="blueprint"] .kpi,
html[data-skin="blueprint"] .list,
html[data-skin="blueprint"] .tile,
html[data-skin="blueprint"] .sheet{border-color:var(--line);box-shadow:none}
html[data-skin="blueprint"] .card-title{color:#13203a}
html[data-skin="blueprint"] .segmented{background:#e9eff7;border-color:#dde5f0;border-radius:10px}
html[data-skin="blueprint"] .segmented button{border-radius:8px;color:var(--text-2)}
html[data-skin="blueprint"] .segmented button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.14)}
html[data-skin="blueprint"] .btn{background:#fff;border-color:#cdd8e7;color:var(--text)}
html[data-skin="blueprint"] .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 18px -12px var(--brand)}
html[data-skin="blueprint"] .btn.primary:hover{background:#1e40af}
html[data-skin="blueprint"] .dash-hero,
html[data-skin="blueprint"] .score-hero,
html[data-skin="blueprint"] .hero{background:linear-gradient(135deg,#1e3a8a,#1d4ed8 52%,#2563eb);border:1px solid #1e40af;box-shadow:0 22px 44px -32px #1e3a8a}
html[data-skin="blueprint"] .dash-kpi{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.36);border-radius:9px}
html[data-skin="blueprint"] .kpi .v,
html[data-skin="blueprint"] .big-score{font-variant-numeric:tabular-nums;color:var(--brand)}
html[data-skin="blueprint"] .dash-hero .dash-kpi .v,
html[data-skin="blueprint"] .dash-hero .dash-kpi .k,
html[data-skin="blueprint"] .dash-hero .dash-kpi .d{color:#fff;opacity:1}
html[data-skin="blueprint"] .dash-hero p{opacity:1;color:rgba(255,255,255,.95)}
html[data-skin="blueprint"] .dash-hero .dash-kpi{background:rgba(255,255,255,.18)}
html[data-skin="blueprint"] .score-hero .big-score,
html[data-skin="blueprint"] .hero .big-score{color:#fff}
html[data-skin="blueprint"] .sheet-g b{border-radius:6px}
html[data-skin="blueprint"] .list-ico,
html[data-skin="blueprint"] .tile .ti{border-radius:8px;background:var(--brand-soft)}
html[data-skin="blueprint"] .tabbar{background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
html[data-skin="blueprint"] ::selection{background:#cfe0ff;color:#0f172a}
html[data-skin="blueprint"] .dash-hero .btn{background:#fff;color:var(--brand)}
html[data-skin="blueprint"] .dash-hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.48)}
html[data-skin="blueprint"] .foot{border-top:1px solid var(--line)}

/* —— 3) 暖调杂志：米白纸感、衬线标题、砖红、直角、双线分隔 —— */
html[data-skin="editorial"]{
  --brand:#9a3412;--brand-2:#b45309;--brand-soft:#f7ebdd;
  --accent:#1f3a5f;--accent-soft:#eef1f6;
  --ok:#3f6212;--ok-soft:#eff4e5;--warn:#9a3412;--warn-soft:#f7ebdd;
  --bad:#9f1239;--bad-soft:#fbeef1;--info:#1e40af;--info-soft:#eef2fb;
  --bg:#f6f1e7;--bg-2:#fffdf7;--card:#fffdf7;--card-2:#f8f2e6;
  --text:#211c16;--text-2:#5b5147;--text-3:#8b7f70;
  --line:#ded2c0;--line-2:#ece3d3;
  --r-sm:2px;--r:2px;--r-lg:3px;--radius-sm:2px;--radius:2px;--radius-lg:3px;
  --sh-1:none;--sh-2:none;--shadow:none;--shadow-sm:none;
}
html[data-skin="editorial"] body{background-image:radial-gradient(rgba(120,90,50,.055) 1px,transparent 1px);background-size:18px 18px}
html[data-skin="editorial"] .topbar{background:rgba(255,253,247,.94);border-bottom:2px solid var(--text)}
html[data-skin="editorial"] .logo{background:var(--text);border-radius:0;font-family:var(--serif)}
html[data-skin="editorial"] .nav button{border-radius:0;font-weight:600}
html[data-skin="editorial"] .nav button.on{background:transparent;color:var(--brand);box-shadow:inset 0 -2px 0 var(--brand)}
html[data-skin="editorial"] .ph-title,
html[data-skin="editorial"] .card-title,
html[data-skin="editorial"] .dash-hero h1,
html[data-skin="editorial"] .big-score{font-family:var(--serif);font-weight:600;letter-spacing:0}
html[data-skin="editorial"] .crumb b{color:var(--brand);letter-spacing:.5px}
html[data-skin="editorial"] .card{border-top:2px solid var(--text);border-radius:0}
html[data-skin="editorial"] .card-title{font-size:var(--fs-15)}
html[data-skin="editorial"] .kpi{border-top:2px solid var(--text);border-radius:0;background:transparent}
html[data-skin="editorial"] .list{border-radius:0}
html[data-skin="editorial"] .list-row{border-top-style:dotted}

<main class="wrap">

  四级备考领航教练 · 数据本机与云端双重保存<br>
  词汇/题目为备考模拟素材，分数为估算参考值，不构成官方成绩
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<!-- 部署配置：后端 API 地址（GitHub Pages 与后端不同源） -->
<script src="./config.js"></script>
<script>
"use strict";
/* =====================================================================
   四级备考领航教练 · CET-4 Coach
   单文件离线应用：诊断 → 能力画像 → 分阶段备考计划 → 练习 → 工具箱
   ===================================================================== */

/* ---------------------------------------------------------------
   1. 常量与存储层
   --------------------------------------------------------------- */
const STORE_KEY = "cet4coach.v1";
const BANK_CACHE_KEY = "cet4coach.bank.v1";

/* ---------------------------------------------------------------
   静态部署配置（GitHub Pages 与后端不同源）
   后端地址在 config.js 中配置，例如：
   window.CET4_CONFIG = { API_BASE: "https://xxx.trycloudflare.com" };
   --------------------------------------------------------------- */
const APP_CONFIG = window.CET4_CONFIG || {};
const API_BASE = String(APP_CONFIG.API_BASE || "").trim().replace(/\/+$/, "");
const CROSS_ORIGIN = /^https?:\/\//i.test(API_BASE);
const CONFIG_READY = !!API_BASE && !/REPLACE|YOUR-TUNNEL|example\.com/i.test(API_BASE);
const TOKEN_KEY = "cet4coach.token.v1";

function getToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
}
function setToken(t) {
  try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) { /* 忽略 */ }
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/* ---------------------------------------------------------------
   0. 云端账号 / 同步层
   --------------------------------------------------------------- */
const CLOUD = {
  me: null,          // 当前登录用户
  version: 0,        // 服务端快照版本号（乐观锁）
  timer: null,
  lost: false,       // 会话过期
  conflict: null,    // 待用户裁决的冲突快照
  busy: false
};

function api(path, opts) {
  const o = Object.assign({ method: "GET", credentials: CROSS_ORIGIN ? "include" : "same-origin", headers: {} }, opts || {});
  const token = getToken();
  if (token) o.headers["Authorization"] = "Bearer " + token;
  if (o.body !== undefined && typeof o.body !== "string") {
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(o.body);
  }
  return fetch(API_BASE + path, o).then(res => res.json().catch(() => null).then(data => ({ status: res.status, data: data })));
}

function gotoLogin() {
  setToken("");
  const next = encodeURIComponent(location.pathname + location.search + location.hash);
  location.replace("login.html?next=" + next);
}

let _badge = null;
function setSyncBadge(kind, msg) {
  if (!_badge) {
    _badge = document.createElement("div");
    _badge.id = "cloudBadge";
    document.body.appendChild(_badge);
  }
  const map = {
    saved: ["已同步", "#10b981"],
    saving: ["同步中…", "#94a3b8"],
    error: ["同步失败", "#ef4444"],
    lost: ["登录已过期", "#f59e0b"]
  };
  const it = map[kind] || map.saved;
  _badge.textContent = msg || it[0];
  _badge.style.cssText = "position:fixed;left:14px;bottom:14px;z-index:60;font-size:12px;padding:4px 10px;" +
    "border-radius:999px;background:" + it[1] + ";color:#fff;opacity:.86;pointer-events:none;" +
    "font-family:system-ui,-apple-system,sans-serif;transition:opacity .3s";
  if (kind === "saved") setTimeout(() => { if (_badge) _badge.style.opacity = "0"; }, 1600);
  if (_badge) _badge.style.opacity = ".86";
}

// 上传前剔除只应留在本机的敏感配置
function stateForCloud() {
  const c = clone(S);
  delete c.__hasLocal;
  if (c.settings) c.settings = Object.assign({}, c.settings, { apiKey: "" });
  return c;
}

function cloudPush(immediate) {
  if (!CLOUD.me) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(doPush, immediate ? 0 : 900);
}

function doPush() {
  if (!CLOUD.me || CLOUD.busy || CLOUD.conflict) return;
  CLOUD.busy = true;
  setSyncBadge("saving");
  api("/api/state", { method: "PUT", body: { version: CLOUD.version, payload: stateForCloud() } })
    .then(r => {
      CLOUD.busy = false;
      if (r.status === 200 && r.data && r.data.data) {
        CLOUD.version = r.data.data.version;
        CLOUD.lost = false;
        setSyncBadge("saved");
      } else if (r.status === 409) {
        CLOUD.conflict = (r.data && r.data.data) || {};
        askConflict();
      } else if (r.status === 401) {
        CLOUD.lost = true;
        setSyncBadge("lost", "登录已过期，数据已存在本机");
      } else {
        setSyncBadge("error");
      }
    })
    .catch(() => { CLOUD.busy = false; setSyncBadge("error"); });
}

function askConflict() {
  const c = CLOUD.conflict || {};
  openModal(
    '<div class="card-title">检测到云端数据已更新</div>' +
    '<p class="small muted">同一账号在其他设备/标签页修改过学习记录（云端版本 v' + (c.version || "?") +
    '）。请选择保留哪一份，未保留的一方会被覆盖。</p>' +
    '<div class="row wrap mt"><button class="btn primary" id="cfLocal">保留本机数据并覆盖云端</button>' +
    '<button class="btn" id="cfServer">使用云端数据</button></div>'
  );
  $("#cfLocal").addEventListener("click", () => {
    CLOUD.version = c.version || CLOUD.version;
    CLOUD.conflict = null;
    closeModal();
    cloudPush(true);
  });
  $("#cfServer").addEventListener("click", () => {
    const keepKey = (S.settings || {}).apiKey || "";
    S = normalizeState(c.payload || {});
    if (!S.settings.apiKey) S.settings.apiKey = keepKey;
    CLOUD.version = c.version || CLOUD.version;
    CLOUD.conflict = null;
    closeModal();
    saveLocal();
    applySkin();
    go((location.hash || "").replace("#", "") || "home");
    toast("已使用云端数据");
  });
}

// 从服务端快照还原为完整状态对象
function normalizeState(p) {
  p = p || {};
  return Object.assign(clone(DEFAULT_STATE), p, {
    settings: Object.assign(clone(DEFAULT_STATE.settings), p.settings || {}),
    stats: Object.assign(clone(DEFAULT_STATE.stats), p.stats || {}),
    wrong: Array.isArray(p.wrong) ? p.wrong : [],
    history: Array.isArray(p.history) ? p.history : [],
    aiBank: normAIBank(p.aiBank),
    aiNotes: normAINotes(p.aiNotes),
    aiUpdates: Array.isArray(p.aiUpdates) ? p.aiUpdates : []
  });
}

const DEFAULT_STATE = {
  version: 1,
  theme: "light",
  skin: "scholar",
  wordPage: 0,
  settings: { baseUrl: "", apiKey: "", model: "", targetScore: null, examDate: "" },
  diagnostic: null,
  plan: null,
  wrong: [],
  stats: { sessions: 0, answered: 0, correct: 0, minutes: 0 },
  history: [],
  aiBank: { listening: [], reading: [], vocabulary: [], writing: [], translation: [] },
  aiNotes: {},
  aiUpdates: []
};

let S = null;

function clone(o) { return JSON.parse(JSON.stringify(o)); }

// 把任意来源的 aiBank / aiNotes / aiUpdates 归一化成合法结构
function normAIBank(src) {
  const out = clone(DEFAULT_STATE.aiBank);
  Object.keys(out).forEach(k => {
    const v = src && src[k];
    out[k] = Array.isArray(v) ? v.filter(x => x && typeof x === "object") : [];
  });
  return out;
}
function normAINotes(src) {
  const out = {};
  if (src && typeof src === "object") {
    Object.keys(src).forEach(k => {
      const v = src[k];
      if (typeof v === "string" && v.trim()) out[k] = v.trim();
    });
  }
  return out;
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
  if (!raw) return clone(DEFAULT_STATE);
  try {
    const par = JSON.parse(raw);
    const st = normalizeState(par);
    st.__hasLocal = true;
    st.savedAt = par.savedAt || 0;
    return st;
  } catch (e) {
    return clone(DEFAULT_STATE);
  }
}

// 仅写本机（用于服务端数据落盘，不触发上传）
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* 忽略容量问题 */ }
}

function save() {
  S.savedAt = Date.now();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
  } catch (e) {
    toast("本地存储写入失败（可能空间不足）");
  }
  if (CLOUD.lost) setSyncBadge("lost", "登录已过期，数据已存在本机");
  else cloudPush();
}

/* ---------------------------------------------------------------
   2. 通用工具
   --------------------------------------------------------------- */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }
function fmtSec(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function round1(v) { return Math.round(v * 10) / 10; }

let toastTimer = null;
function toast(msg, ms) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), ms || 2600);
}

function openModal(html) {
  $("#modalBox").innerHTML = html;
  $("#modal").classList.add("on");
}
function closeModal() { $("#modal").classList.remove("on"); }

/* ---------------------------------------------------------------
   3. 主题
   --------------------------------------------------------------- */
/* ---------------------------------------------------------------
   3. 视觉风格（三套皮肤，一键切换）
   --------------------------------------------------------------- */
const SKINS = [
  { id: "scholar", name: "纸感学术", short: "纸感", theme: "light", icon: "◐", desc: "细描边 + 深青，克制清晰" },
  { id: "blueprint", name: "冷蓝蓝图", short: "蓝图", theme: "light", icon: "◈", desc: "冷灰底 + 白卡蓝字，对比强、久读不累" },
  { id: "editorial", name: "暖调杂志", short: "杂志", theme: "light", icon: "▤", desc: "米白纸感 + 衬线标题，沉稳叙事" }
];
function skinOf(id) { return SKINS.find(s => s.id === id) || SKINS[0]; }
function skinDotsHTML() {
  return SKINS.map(s => '<button class="skin-dot" data-skin-pick="' + s.id + '" aria-label="' + s.name + '风格"></button>').join("");
}
function applySkin() {
  const sk = skinOf(S.skin);
  S.theme = sk.theme;
  document.documentElement.setAttribute("data-skin", sk.id);
  document.documentElement.setAttribute("data-theme", sk.theme);
  const b = $("#themeBtn");
  if (b) {
    b.textContent = sk.icon;
    b.title = "当前风格：" + sk.name + " · 点击切换（Alt+1/2/3 直选）";
    b.setAttribute("aria-label", b.title);
  }
  $$("[data-skin-pick]").forEach(el => {
    const on = el.dataset.skinPick === sk.id;
    el.classList.toggle("on", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    el.title = "切换到「" + skinOf(el.dataset.skinPick).name + "」";
  });
}
/* 兼容旧调用点（数据清空后重绘主题） */

/* 路由支持二级路径：#practice/words、#tools/dict */
function parseRoute(raw) {
  const parts = String(raw || "home").replace(/^#/, "").split("/");
  return { id: parts[0] || "home", sub: parts[1] || "" };
}
function hashOf(id, sub) { return "#" + id + (sub ? "/" + sub : ""); }
function setRouteHash(id, sub) {
  const h = hashOf(id, sub);
  if (location.hash !== h) history.replaceState(null, "", h);
}

function go(target, opts) {
  const { id: rawId, sub } = parseRoute(target);
  const id = ROUTES.some(r => r.id === rawId) ? rawId : "home";
  if (id === "practice") {
    if (sub && PRACTICE_TABS.some(t => t.id === sub)) PTab = sub;
    else if (!sub) PTab = "train";
  }
  if (id === "tools") {
    if (sub && TOOL_TABS.some(t => t.id === sub)) TT = sub;
    else if (!sub) TT = "dict";
  }
  if (id === "settings") SET_TAB = sub || "setSkin";
  current = id;
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + id));
  syncNav(id);
  const fn = RENDER[id];
  if (typeof fn === "function") fn(opts || {});
  window.scrollTo({ top: 0, behavior: "smooth" });
  setRouteHash(id, id === "practice" ? (PTab === "train" ? "" : PTab) : id === "tools" ? TT : id === "settings" ? (SET_TAB === "setSkin" ? "" : SET_TAB) : "");
}

/* ---------------------------------------------------------------
   5. 网络能力：AI（OpenAI 兼容）+ 词典（dictionaryapi.dev）
   --------------------------------------------------------------- */
function hasAI() { return !!(S.settings && S.settings.apiKey); }

function aiEndpoint() {
  const base = (S.settings.baseUrl || "https://api.openai.com/v1").trim().replace(/\/+$/, "");
  return base + "/chat/completions";
}

async function callAI(messages, opts) {
  opts = opts || {};
  if (!hasAI()) throw new Error("尚未配置 API Key，请到「设置」中填写。");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 60000);
  try {
    const res = await fetch(aiEndpoint(), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + S.settings.apiKey
      },
      body: JSON.stringify({
        model: S.settings.model || "gpt-4o-mini",
        messages: messages,
        temperature: opts.temperature == null ? 0.5 : opts.temperature
      }),
      signal: ctrl.signal
    });
    if (!res.ok) {
      const txt = await res.text().catch(() => "");
      throw new Error("接口返回 " + res.status + " " + txt.slice(0, 180));
    }
    const data = await res.json();
    const c = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!c) throw new Error("接口未返回内容");
    return c.trim();
  } finally {
    clearTimeout(timer);
  }
}

async function lookupDict(word) {
  const res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word));
  if (!res.ok) throw new Error("词典中未找到该词");
  return await res.json();
}

let DIAG = {};

const MODULES = ["listening", "reading", "writing", "translation"];
const MOD_LABEL = { listening: "听力", reading: "阅读", writing: "写作", translation: "翻译" };

function cefrOf(total) {

  if (total >= 550) return { c: "B2+", d: "具备较强的学术英语能力，冲刺高分很有潜力" };

// 主观题：本地规则估分（满分 15 档）
const LINKERS = ["however", "therefore", "moreover", "furthermore", "in addition", "for example",
  "in conclusion", "on the other hand", "as a result", "besides", "firstly", "secondly",
  "finally", "in my view", "to begin with", "what is more", "in short", "in a word"];

function textStats(text) {
  const clean = text.trim();
  const words = clean ? clean.split(/\s+/).filter(Boolean) : [];
  const n = words.length;
  const uniq = new Set(words.map(w => w.toLowerCase().replace(/[^a-z]/g, "")).filter(Boolean)).size;
  const sentences = clean.split(/[.!?;]+/).filter(s => s.trim().length > 1).length || (n ? 1 : 0);
  const low = clean.toLowerCase();
  const linkers = LINKERS.filter(l => low.includes(l)).length;
  return { n, uniq, ttr: n ? uniq / n : 0, sentences, avgLen: sentences ? n / sentences : 0, linkers };
}

function gradeStylePoints(st) {
  let s = 0;
  if (st.ttr >= 0.62) s += 4; else if (st.ttr >= 0.52) s += 3; else if (st.ttr >= 0.42) s += 2; else if (st.n) s += 1;
  if (st.avgLen >= 16) s += 3; else if (st.avgLen >= 12) s += 2; else if (st.n) s += 1;
  if (st.linkers >= 3) s += 3; else if (st.linkers >= 2) s += 2; else if (st.linkers >= 1) s += 1;
  return s;
}

function gradeWritingRule(text, cfg) {
  const st = textStats(text);
  if (!st.n) return { score: 0, stats: st, notes: ["未检测到有效内容。"] };
  let s = 0;
  const notes = [];
  if (st.n >= cfg.minWords && st.n <= cfg.maxWords) { s += 5; notes.push("字数 " + st.n + " 词，符合 " + cfg.minWords + "–" + cfg.maxWords + " 的要求。"); }
  else if (st.n >= cfg.minWords * 0.85) { s += 4; notes.push("字数 " + st.n + " 词，略低于要求下限，建议补足。"); }
  else if (st.n >= 80) { s += 3; notes.push("字数仅 " + st.n + " 词，明显不足，会被降档。"); }
  else if (st.n >= 40) { s += 2; notes.push("篇幅过短（" + st.n + " 词），难以展开论证。"); }
  else { s += 1; notes.push("篇幅严重不足，几乎无法评分。"); }
  s += gradeStylePoints(st);
  notes.push("词汇多样性 TTR≈" + round1(st.ttr) + "，平均句长≈" + round1(st.avgLen) + " 词，连接词命中 " + st.linkers + " 个。");
  return { score: clamp(s, 0, 15), stats: st, notes: notes };
}

function gradeTranslationRule(text, cfg) {
  const st = textStats(text);
  if (!st.n) return { score: 0, stats: st, notes: ["未检测到有效内容。"] };
  const refWords = cfg.reference.trim().split(/\s+/).length;
  const ratio = st.n / refWords;
  const notes = [];
  let s = 0;
  if (ratio >= 0.85 && ratio <= 1.35) { s += 6; notes.push("译文长度与参考译文接近，信息量较完整。"); }
  else if (ratio >= 0.7) { s += 5; notes.push("译文略短，可能有信息遗漏。"); }
  else if (ratio >= 0.5) { s += 3; notes.push("译文明显偏短，估计遗漏了部分信息点。"); }
  else { s += 1; notes.push("译文过短，原文信息大量缺失。"); }
  s += Math.min(gradeStylePoints(st), 9);
  notes.push("词汇多样性 TTR≈" + round1(st.ttr) + "，平均句长≈" + round1(st.avgLen) + " 词。");
  return { score: clamp(s, 0, 15), stats: st, notes: notes };
}

let D = null;

  const refresh = () => { voicesCache = window.speechSynthesis.getVoices() || []; };
  refresh();
  window.speechSynthesis.onvoiceschanged = refresh;
}
function pickEnglishVoice() {
  if (!voicesCache.length && "speechSynthesis" in window) voicesCache = window.speechSynthesis.getVoices() || [];
  return voicesCache.find(v => /en[-_]US/i.test(v.lang)) || voicesCache.find(v => /^en/i.test(v.lang)) || null;
}
function ttsSupported() { return "speechSynthesis" in window; }
function stopSpeak() {
  if (ttsSupported()) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  D && (D.speaking = false);
  const w = $("#wave"); if (w) w.classList.remove("on");
}
function speakParts(parts, onDone) {
  if (!ttsSupported()) { toast("当前浏览器不支持语音合成，请直接阅读听力原文"); onDone && onDone(); return; }
  try { window.speechSynthesis.cancel(); } catch (e) {}
  D.speaking = true;
  const w = $("#wave"); if (w) w.classList.add("on");
  let i = 0;
  const next = () => {
    if (!D || !D.speaking) return;
    if (i >= parts.length) { D.speaking = false; if (w) w.classList.remove("on"); onDone && onDone(); return; }
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.lang = "en-US"; u.rate = 0.95; u.pitch = 1;
    const v = pickEnglishVoice(); if (v) u.voice = v;
    u.onend = next; u.onerror = next;
    window.speechSynthesis.speak(u);
  };
  next();
}

function countHint(text, cfg, isEssay) {
  const n = (text || "").trim() ? text.trim().split(/\s+/).filter(Boolean).length : 0;
  if (!isEssay) return "当前 " + n + " 词。参考译文约 " + cfg.reference.trim().split(/\s+/).length + " 词。";
  const ok = n >= cfg.minWords && n <= cfg.maxWords;
  return "当前 " + n + " 词" + (ok ? " ✓ 符合要求" : n < cfg.minWords ? "（还需 " + (cfg.minWords - n) + " 词）" : "（超出上限 " + (n - cfg.maxWords) + " 词）");
}
/* ---------------------------------------------------------------
   13. 提交诊断 · 评分（AI 优先，规则兜底）
   --------------------------------------------------------------- */
function parseScoreJSON(txt) {
  const m = String(txt).match(/\{[\s\S]*\}/);
  if (m) {
    try {
      const o = JSON.parse(m[0]);
      if (o && typeof o.score !== "undefined") return o;
    } catch (e) {}
  }
  const sm = String(txt).match(/score["'\s:]*([0-9]+(?:\.[0-9]+)?)/i);
  if (sm) return { score: Number(sm[1]), comment: String(txt).slice(0, 500) };
  return { score: null, comment: String(txt).slice(0, 500) };
}
function normAI(o) {
  const out = { score: clamp(Math.round(Number(o.score) || 0), 0, 15), comment: o.comment || "" };
  if (Array.isArray(o.strengths)) out.strengths = o.strengths.slice(0, 4);
  if (Array.isArray(o.weaknesses)) out.weaknesses = o.weaknesses.slice(0, 4);
  return out;
}

async function gradeWritingAI(text, cfg) {
  const sys = "你是一位资深的大学英语四级（CET-4）写作阅卷老师，熟悉官方评分标准（内容切题、语言准确、篇章结构，满分 15 分）。你的评分必须严格、中肯，并给出具体可执行的建议。";
  const usr = "【作文题目】\n" + cfg.prompt + "\n\n【学生作文】\n" + text +
    "\n\n请严格按 CET-4 的 15 分制评分，只返回一个 JSON 对象，不要输出任何多余文字：\n" +
    '{"score": 0到15的整数, "comment": "总体点评（120字以内，中文）", "strengths": ["优点1","优点2"], "weaknesses": ["问题1","问题2"]}';
  const out = await callAI([{ role: "system", content: sys }, { role: "user", content: usr }], { temperature: 0.3 });
  return normAI(parseScoreJSON(out));
}

async function gradeTranslationAI(text, cfg) {
  const sys = "你是一位资深的大学英语四级（CET-4）翻译阅卷老师，熟悉官方评分标准（信息完整、语言准确、表达地道，满分 15 分）。评分要严格、中肯。";

    "\n\n请严格按 CET-4 的 15 分制评分，只返回一个 JSON 对象，不要输出任何多余文字：\n" +
    '{"score": 0到15的整数, "comment": "总体点评（120字以内，中文）", "strengths": ["优点1","优点2"], "weaknesses": ["问题1","问题2"]}';
  const out = await callAI([{ role: "system", content: sys }, { role: "user", content: usr }], { temperature: 0.3 });
  return normAI(parseScoreJSON(out));
}

  const elapsed = Math.floor((Date.now() - D.t0) / 1000);
  const modules = {};

  ["listening", "reading"].forEach(mod => {

    DIAG[mod].groups.forEach((g, gi) => {

        total++;
        const k = mod + "-" + gi + "-" + qi;
        const picked = D.answers[k];
        if (picked === q.ans) correct++;
        else S.wrong.push({
          id: uid(), mod: mod, stem: q.stem, opts: q.opts.slice(), ans: q.ans,
          picked: picked == null ? -1 : picked, exp: q.exp, from: "诊断", date: today()
        });
      });
    });
    const ratio = total ? correct / total : 0;
    modules[mod] = round1(ratio * DIAG[mod].weight);
    detail[mod] = { correct: correct, total: total, ratio: ratio };
  });

  // ---- 主观题 ----
  try {
    if (hasAI() && D.essay.trim()) {
      try {
        const r = await gradeWritingAI(D.essay, DIAG.writing);
        detail.writing = { score15: r.score, notes: [r.comment].filter(Boolean), ai: true, strengths: r.strengths || [], weaknesses: r.weaknesses || [] };
      } catch (e) {
        const r = gradeWritingRule(D.essay, DIAG.writing);
        detail.writing = { score15: r.score, notes: r.notes, ai: false, aiError: e.message };
      }
    } else {
      const r = gradeWritingRule(D.essay, DIAG.writing);
      detail.writing = { score15: r.score, notes: r.notes, ai: false };
    }
    if (hasAI() && D.trans.trim()) {
      try {
        const r = await gradeTranslationAI(D.trans, DIAG.translation);
        detail.translation = { score15: r.score, notes: [r.comment].filter(Boolean), ai: true, strengths: r.strengths || [], weaknesses: r.weaknesses || [] };
      } catch (e) {
        const r = gradeTranslationRule(D.trans, DIAG.translation);
        detail.translation = { score15: r.score, notes: r.notes, ai: false, aiError: e.message };
      }
    } else {
      const r = gradeTranslationRule(D.trans, DIAG.translation);
      detail.translation = { score15: r.score, notes: r.notes, ai: false };
    }
  } catch (e) {
    detail.writing = detail.writing || { score15: 0, notes: ["评分异常：" + e.message], ai: false };
    detail.translation = detail.translation || { score15: 0, notes: ["评分异常：" + e.message], ai: false };
  }
  modules.writing = round1(detail.writing.score15 / 15 * DIAG.writing.weight);
  modules.translation = round1(detail.translation.score15 / 15 * DIAG.translation.weight);

  const total = round1(modules.listening + modules.reading + modules.writing + modules.translation);
  const cefr = cefrOf(total);

  const diag = {
    date: today(), ts: Date.now(), minutes: Math.round(elapsed / 60),
    modules: modules, total: total, level: cefr.c, cefrDesc: cefr.d,
    target: S.settings.targetScore || suggestTarget(total),
    detail: detail,
    raw: { answers: D.answers, essay: D.essay, trans: D.trans }
  };

  S.diagnostic = diag;
  if (!S.settings.targetScore) S.settings.targetScore = diag.target;
  S.history.push({ date: diag.date, total: total, level: cefr.c });

  // 统计
  let answered = 0, correctAll = 0;
  ["listening", "reading"].forEach(m => { answered += detail[m].total; correctAll += detail[m].correct; });
  S.stats.sessions += 1;
  S.stats.answered += answered + 2;
  S.stats.correct += correctAll;
  S.stats.minutes += Math.round(elapsed / 60);

  // 首次诊断自动生成计划
  let planCreated = false;
  if (!S.plan) { S.plan = buildPlan(diag); planCreated = true; }

  save();
  D = null;
  go("result");
  toast(planCreated ? "诊断完成，已为你生成备考计划 🎉" : "诊断完成，画像已更新 🎉", 3200);
}

function hexA(hex, a) {
  hex = String(hex).trim();
  if (hex.indexOf("rgb") === 0) return hex.replace("rgb(", "rgba(").replace(")", "," + a + ")");
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

function drawRadar(cv, ratios, labels) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 340, H = cv.clientHeight || 300;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const css = getComputedStyle(document.documentElement);
  const gridColor = css.getPropertyValue("--line-2").trim() || "#eef0f5";
  const lineColor = css.getPropertyValue("--line").trim() || "#e6e8ef";
  const textColor = css.getPropertyValue("--text-2").trim() || "#5b6372";
  const brand = css.getPropertyValue("--brand").trim() || "#4f46e5";

  const n = ratios.length;
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 46;
  const angle = i => -Math.PI / 2 + i * 2 * Math.PI / n;

  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = angle(i), r = R * ring / 4;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = ring === 4 ? lineColor : gridColor;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const a = angle(i);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.strokeStyle = gridColor; ctx.stroke();
  }

  ctx.beginPath();
  ratios.forEach((v, i) => {
    const a = angle(i), r = R * clamp(v, 0.02, 1);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = hexA(brand, 0.2); ctx.fill();
  ctx.strokeStyle = brand; ctx.lineWidth = 2.4; ctx.stroke();

  ratios.forEach((v, i) => {
    const a = angle(i), r = R * clamp(v, 0.02, 1);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    ctx.beginPath(); ctx.arc(x, y, 3.6, 0, Math.PI * 2);
    ctx.fillStyle = brand; ctx.fill();
    ctx.strokeStyle = css.getPropertyValue("--card").trim() || "#fff"; ctx.lineWidth = 1.6; ctx.stroke();
  });

  ctx.font = "700 12.5px " + (css.getPropertyValue("--font").trim() || "sans-serif");
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ratios.forEach((v, i) => {
    const a = angle(i), r = R + 25;
    ctx.fillStyle = textColor;
    ctx.fillText(labels[i] + " " + Math.round(v * 100) + "%", cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  });
}

function subjRow(name, det, weight, text, key) {
  if (!det) return "";
  const s15 = det.score15;
  const score = round1(s15 / 15 * weight);
  return '<details class="fold"><summary>' +
    '<span class="fold-t">' + name + "</span>" +
    '<span class="fold-tag">' + s15 + " / 15 档 · 折算 " + score + " / " + weight + ' 分</span></summary>' +
    '<div class="fold-b">' + subjBody(det, text, key) + "</div></details>";
}
function subjBody(det, text, key) {
  let h = "";
  if (det.notes && det.notes.length) h += '<p class="small mt-s">' + det.notes.map(n => esc(n)).join("</p><p class='small'>") + "</p>";
  if (det.strengths && det.strengths.length) h += '<div class="explain"><b>亮点：</b>' + det.strengths.map(esc).join("；") + "</div>";
  if (det.weaknesses && det.weaknesses.length) h += '<div class="explain" style="background:var(--warn-soft);border-color:var(--warn)"><b style="color:var(--warn)">待改进：</b>' + det.weaknesses.map(esc).join("；") + "</div>";
  if (text) h += '<details class="mt-s"><summary class="small muted" style="cursor:pointer">查看我的作答</summary><div class="tool-out mt-s">' + esc(text) + "</div></details>";
  h += '<details class="mt-s"><summary class="small muted" style="cursor:pointer">查看参考范文/译文</summary><div class="tool-out mt-s">' + esc(key === "essay" ? DIAG.writing.sample : DIAG.translation.reference) + "</div></details>";
  return h;
}

function updateExamCountdown() {
  const el = $("#examCountdown");

  const diff = Math.ceil((new Date(d + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000);

  else if (diff === 0) el.textContent = "就是今天，加油！";
  else el.textContent = "考试日期已过，请更新";
}
