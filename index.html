  { id: "stats", label: "学习记录" }
];
const MOCK_MINUTES = 30;
let P = null;
let PTab = "train";
let SET_TAB = "setSkin";
let mockTimer = null;

// 练习中心子标签（含 AI 题库题数，单独抽出便于局部刷新）
function practiceTabButtonsHTML() {
  const aiQ = aiBankStats().questions;
  return PRACTICE_TABS.map(t =>
    '<button class="chip ' + (PTab === t.id ? "on" : "") + '" data-ptab="' + t.id + '" aria-selected="' + (PTab === t.id) + '">' + t.label +
    (t.id === "wrong" && S.wrong.length ? " (" + S.wrong.length + ")" : "") +
    (t.id === "aibank" && aiQ ? " (" + aiQ + ")" : "") + "</button>").join("");
}
function bindPracticeTabs(el) {
  $$("[data-ptab]", el).forEach(b => b.addEventListener("click", () => {
    PTab = b.dataset.ptab;
    setRouteHash("practice", PTab === "train" ? "" : PTab);
    renderPractice();
  }));
}

function renderPractice() {
  const v = $("#v-practice");
  if (P) { renderPracticeSession(); return; }
  const st = S.stats || {};
  let h = pageHead({
    id: "practice",
    title: "练习中心",
    desc: "按模块专项训练、限时模考，或让 AI 扩充题库；错题与学习记录都在这里。",
    kpis: [
      { k: "累计作答", v: st.answered || 0 },
      { k: "正确率", v: (st.answered ? Math.round(st.correct / st.answered * 100) : 0) + "%" },
      { k: "错题", v: S.wrong.length }
    ]
  });
  const curTab = PRACTICE_TABS.find(t => t.id === PTab) || PRACTICE_TABS[0];
  h += '<div class="seg-stick"><div class="seg-bar"><div class="segmented" id="ptTabs" role="tablist" aria-label="练习分类">' +
    practiceTabButtonsHTML() + '</div><span class="seg-now">练习中心 <i>›</i> <b>' + curTab.label + "</b></span></div></div>";
  h += '<div id="ptBody" role="tabpanel"></div>';
  v.innerHTML = h;
  bindGo(v);
  bindPracticeTabs(v);
  renderPracticeBody();
}

function renderPracticeBody() {
  const el = $("#ptBody");
  if (!el) return;
  let h = "";
  if (PTab === "train") h = renderTrainList();
  else if (PTab === "mock") h = renderMockIntro();
  else if (PTab === "aibank") h = renderAIBank();
  else if (PTab === "words") h = renderWords();
  else if (PTab === "wrong") h = renderWrong();
  else h = renderStats();
  el.innerHTML = h;

  $$("[data-start]", el).forEach(b => b.addEventListener("click", () => startPractice(b.dataset.start)));
  const mb = $("#mockStart", el);
  if (mb) mb.addEventListener("click", startMock);
  bindGo(el);
  bindWords(el);
  bindWrong(el);
  bindAIBank(el);
}

function mockItems() {
  return buildPracticeItems("listening")
    .concat(buildPracticeItems("reading"), buildPracticeItems("vocabulary"));
}

function renderMockIntro() {
  const items = mockItems();
  const count = k => items.filter(x => x.mod === k).length;
  return '<div class="grid g2">' +
    '<div class="card"><div class="card-title">⏱ 限时模考</div>' +
    '<p class="small muted">按考试节奏连续作答，提交后不能回看上一题，时间到自动交卷。答错的题会自动进入错题本。</p>' +
    '<div class="explain mt"><b>共 ' + items.length + " 题 · 限时 " + MOCK_MINUTES +
    ' 分钟。</b>听力题由浏览器朗读音频，建议佩戴耳机；阅读题请先通读原文再作答。</div>' +
    '<div class="row mt-l"><button class="btn primary lg" id="mockStart">开始模考</button>' +
    '<span class="tiny dim" style="align-self:center">开始后计时立即启动</span></div></div>' +
    '<div class="card"><div class="card-title">📦 本次题量</div><div class="grid gauto-sm">' +
    kpiCell("听力", count("listening") + " 题", "浏览器朗读") +
    kpiCell("阅读", count("reading") + " 题", "仔细阅读") +
    kpiCell("词汇", count("vocabulary") + " 题", "高频词") +
    kpiCell("总计", items.length + " 题", "限时 " + MOCK_MINUTES + " 分钟") +
    "</div></div></div>";
}

function startMock() {
  const items = mockItems();
  if (!items.length) { toast("题库内容不足，暂时无法模考"); return; }
  P = {
    mod: "mock", kind: "obj", items: items, idx: 0, picked: null, revealed: false,
    correct: 0, answered: 0, mock: true, deadline: Date.now() + MOCK_MINUTES * 60 * 1000
  };
  renderPractice();
}

function renderTrainList() {
  const cfg = [
    { mod: "listening", icon: "🎧", name: "听力", desc: "短对话 / 短篇新闻，浏览器朗读" },
    { mod: "reading", icon: "📖", name: "阅读", desc: "仔细阅读，限时训练" },
    { mod: "vocabulary", icon: "🔤", name: "词汇选择", desc: "高频词用法与搭配" },
    { mod: "writing", icon: "✍️", name: "写作", desc: "限时作文 + 智能评分" },
    { mod: "translation", icon: "🔄", name: "翻译", desc: "汉译英 + 逐句点评" }
  ];
  let total = 0;
  let h = '<div class="grid gauto" style="--gmin:226px">';
  cfg.forEach(c => {
    const arr = bankOf(c.mod);
    const n = countQ(c.mod, arr);
    const aiN = countQ(c.mod, aiBankArr(c.mod));
    total += n;
    h += '<div class="card" style="padding:14px">' +
      '<div class="row mid between"><div class="row mid" style="gap:8px">' +
      '<span style="font-size:19px">' + c.icon + "</span>" +
      '<span style="font-weight:700;font-size:var(--fs-14)">' + c.name + "</span></div>" +
      '<span class="pill plain">' + n + " 题" + (aiN ? " · AI " + aiN : "") + "</span></div>" +
      '<p class="tiny dim" style="margin:8px 0 12px;min-height:32px">' + c.desc + "</p>" +
      '<button class="btn sm primary" data-start="' + c.mod + '" style="width:100%">开始练习</button></div>';
  });
  h += "</div>";
  h += '<div class="card mt"><div class="card-title">💡 说明</div><p class="small muted">专项练习共 ' + total +
    " 题，其中含 AI 生成题 " + aiBankStats().questions +
    ' 题（可在「AI 题库」中让 AI 继续扩充）。答错的客观题会自动进入错题本，方便日后复盘。所有练习数据只保存在本机浏览器中。</p></div>';
  return h;
}

function buildPracticeItems(mod) {
  const items = [];
  bankOf(mod).forEach((g, gi) => {
    if (g && g.questions) g.questions.forEach((q, qi) => items.push({ mod: mod, gi: gi, qi: qi, q: q, g: g }));
    else if (g && g.stem) items.push({ mod: mod, gi: gi, qi: 0, q: g, g: {} });
  });
  return items;
}

function startPractice(mod) {
  if (mod === "writing" || mod === "translation") {
    const pool = bankOf(mod).filter(g => g && g.prompt);
    if (!pool.length) { toast("暂无该模块练习题"); return; }
    const cfg = pool[Math.floor(Math.random() * pool.length)];
    P = { mod: mod, kind: mod, cfg: cfg, text: "", result: null };
    renderPractice(); return;
  }
  const items = buildPracticeItems(mod);
  if (!items.length) { toast("暂无该模块练习题"); return; }
  P = { mod: mod, kind: "obj", items: items, idx: 0, picked: null, revealed: false, correct: 0, answered: 0 };
  renderPractice();
}

function renderPracticeSession() {
  const v = $("#v-practice");
  if (P.kind === "writing" || P.kind === "translation") { renderSubjPractice(v); return; }
  if (mockTimer) { clearInterval(mockTimer); mockTimer = null; }
  if (P.done) { renderPracticeDone(v); return; }

  const total = P.items.length;
  const it = P.items[P.idx];
  const q = it.q, g = it.g || {}, chosen = P.picked;
  const mod = it.mod || P.mod;

  let h = '<div class="diag-head">' +
    '<span class="pill info">' + esc(BANK_LABEL[mod] || "练习") + "</span>" +
    '<span class="small muted">第 ' + (P.idx + 1) + " / " + total + " 题</span>" +
    '<div class="progress"><i style="width:' + Math.round(P.idx / total * 100) + '%"></i></div>' +
    '<span class="pill plain">正确 ' + P.correct + " / " + P.answered + "</span>" +
    (P.mock ? '<div class="timer" id="mockTimer">' + fmtSec((P.deadline - Date.now()) / 1000) + "</div>" : "") +
    '<button class="btn sm ghost" id="pExit">' + (P.mock ? "放弃模考" : "退出练习") + "</button></div>";

  h += '<div class="card pad-lg">';
  if (mod === "listening" && g.script) {
    h += '<div class="card-title">🎧 ' + esc(g.title) + "</div>" +
      '<div class="audioplay mb"><div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
      '<button class="btn primary sm" id="pPlay">▶ 播放音频</button>' +
      '<button class="btn sm" id="pStop">停止</button></div>';
  } else if (mod === "reading" && g.passage) {
    h += '<div class="card-title">📖 ' + esc(g.title) + '</div><div class="passage mb">' + nl2br(g.passage) + "</div>";
  }
  h += '<div class="qtext' + (mod === "reading" || mod === "listening" ? " en" : "") + '"><b>' + (P.idx + 1) + ".</b> " + esc(q.stem) + "</div>";
  h += q.opts.map((o, oi) => {
    let cls = "opt";
    if (P.revealed) { if (oi === q.ans) cls += " right"; else if (oi === chosen) cls += " wrong"; }
    else if (oi === chosen) cls += " sel";
    return '<div class="' + cls + '" data-oi="' + oi + '"><span class="key">' + String.fromCharCode(65 + oi) + '</span><span class="txt">' + esc(o) + "</span></div>";
  }).join("");
  if (P.revealed) {
    h += '<div class="explain"><b>解析：</b>' + esc(qExp(q)) + "</div>";
    if (chosen == null || chosen !== q.ans) h += '<p class="tiny" style="color:var(--bad);margin-top:8px">本题已加入错题本。</p>';
  }
  h += '<div class="row mt-l"><div class="grow"></div>' +
    (P.revealed
      ? (P.idx < total - 1 ? '<button class="btn primary" id="pNext">下一题 →</button>' : '<button class="btn primary" id="pFinish">查看结果</button>')
      : '<button class="btn primary" id="pSubmit">提交答案</button>') +
    "</div></div>";
  v.innerHTML = h;

  if (mod === "listening" && g.script) {
    setTimeout(() => {
      const parts = [g.script];
      parts.push("Question. " + q.stem);
      q.opts.forEach((o, j) => parts.push(String.fromCharCode(65 + j) + ". " + o));
      const pb = $("#pPlay"); if (pb) pb.addEventListener("click", () => speakParts(parts));
      const sb = $("#pStop"); if (sb) sb.addEventListener("click", stopSpeak);
    }, 0);
  }

  $$(".opt", v).forEach(op => op.addEventListener("click", () => {
    if (P.revealed) return;
    P.picked = Number(op.dataset.oi);
    renderPracticeSession();
  }));
  const sb = $("#pSubmit");
  if (sb) sb.addEventListener("click", () => {
    if (P.picked == null) { toast("请先选择一个答案"); return; }
    P.revealed = true;
    P.answered++;
    if (P.picked === q.ans) P.correct++;
    else S.wrong.push({
      id: uid(), mod: mod, stem: q.stem, opts: q.opts.slice(), ans: q.ans,
      picked: P.picked, exp: q.exp, from: P.mock ? "限时模考" : "专项练习", date: today()
    });
    S.stats.answered++;
    if (P.picked === q.ans) S.stats.correct++;
    save();
    renderPracticeSession();
  });
  const nb = $("#pNext");
  if (nb) nb.addEventListener("click", () => { P.idx++; P.picked = null; P.revealed = false; renderPracticeSession(); });
  const fb = $("#pFinish");
  if (fb) fb.addEventListener("click", () => { stopSpeak(); P.done = true; renderPracticeSession(); });
  const eb = $("#pExit");
  if (eb) eb.addEventListener("click", () => {
    if (mockTimer) { clearInterval(mockTimer); mockTimer = null; }
    stopSpeak(); P = null; renderPractice();
  });

  if (P.mock) startMockTimer();
}

function startMockTimer() {
  if (mockTimer) clearInterval(mockTimer);
  const tick = () => {
    const el = $("#mockTimer");
    if (!el || !P || !P.mock) { clearInterval(mockTimer); mockTimer = null; return; }
    const left = Math.max(0, Math.round((P.deadline - Date.now()) / 1000));
    el.textContent = fmtSec(left);
    el.classList.toggle("hot", left <= 300);
    if (left <= 0) {
      clearInterval(mockTimer); mockTimer = null;
      stopSpeak();
      P.done = true;
      toast("时间到，已自动交卷");
      renderPracticeSession();
    }
  };
  tick();
  mockTimer = setInterval(tick, 1000);
}

function renderPracticeDone(v) {
  const mock = !!P.mock;
  const mod = mock ? ((P.items[0] && P.items[0].mod) || "listening") : P.mod;
  const rate = P.answered ? Math.round(P.correct / P.answered * 100) : 0;
  const title = mock ? "⏱ 限时模考完成" : esc(BANK_LABEL[mod]) + " 练习完成";
  v.innerHTML = '<div class="card pad-lg center" style="padding:48px 24px">' +
    '<div style="font-size:40px">' + (rate >= 80 ? "🎉" : rate >= 60 ? "👍" : "💪") + "</div>" +
    '<h2 style="margin:12px 0 6px">' + title + "</h2>" +
    '<p class="muted">答对 <b>' + P.correct + "</b> / " + P.answered + " 题，正确率 <b>" + rate + "%</b></p>" +
    (mock ? '<p class="tiny dim">答错的题目已自动加入错题本，建议当天复盘。</p>' : "") +
    '<div class="row mt-l" style="justify-content:center;flex-wrap:wrap">' +
    '<button class="btn primary" id="pAgain">' + (mock ? "再来一次模考" : "再练一次") + "</button>" +
    '<button class="btn" id="pBack">返回练习中心</button>' +
    '<button class="btn ghost" id="pPlan">回到计划</button></div></div>';
  $("#pAgain").addEventListener("click", () => {
    const again = mock;
    P = null;
    if (again) startMock(); else startPractice(mod);
  });
  $("#pBack").addEventListener("click", () => { P = null; renderPractice(); });
  $("#pPlan").addEventListener("click", () => { P = null; go("plan"); });
}
/* ---------------------------------------------------------------
   16.1 写作 / 翻译专项练习
   --------------------------------------------------------------- */
function renderSubjPractice(v) {
  const isW = P.kind === "writing";
  const cfg = P.cfg;
  let h = '<div class="diag-head"><span class="pill info">' + (isW ? "写作练习" : "翻译练习") + "</span>" +
    '<span class="small muted">' + (isW ? "建议限时 30 分钟" : "建议限时 15 分钟") + "</span>" +
    '<div class="grow"></div><button class="btn sm ghost" id="sExit">退出练习</button></div>';
  h += '<div class="card pad-lg"><div class="card-title">' + (isW ? "✍️ 作文题目" : "🔄 翻译题目") + "</div>";
  h += '<div class="' + (isW ? "qtext en" : "passage") + '">' + esc(cfg.prompt) + "</div>";
  if (isW) h += '<p class="tiny dim">要求：' + cfg.minWords + "–" + cfg.maxWords + " 词。</p>";
  h += '<textarea class="input mt-s" id="sText" style="min-height:' + (isW ? 220 : 160) + 'px" placeholder="在此输入你的英文' + (isW ? "作文" : "译文") + '……">' + esc(P.text || "") + "</textarea>";
  h += '<div class="hint" id="sCount"></div>';
  h += '<div class="row mt"><button class="btn primary" id="sGrade">提交并评分</button>' +
    '<button class="btn ghost" id="sSample">' + (isW ? "查看参考范文" : "查看参考译文") + "</button>" +
    '<span class="tiny dim" style="align-self:center">' + (hasAI() ? "将调用 AI 评分（约 5–15 秒）" : "未配置 AI，将使用本地规则估算") + "</span></div>";
  h += '<div id="sResult" class="mt">' + subjResultHTML() + "</div></div>";
  v.innerHTML = h;

  const ta = $("#sText");
  const upd = () => {
    P.text = ta.value;
    const el = $("#sCount");
    if (el) el.textContent = isW ? countHint(P.text, cfg, true) : countHint(P.text, cfg, false);
  };
  ta.addEventListener("input", upd);
  upd();
  $("#sExit").addEventListener("click", () => { P = null; renderPractice(); });
  $("#sGrade").addEventListener("click", gradeSubjPractice);
  $("#sSample").addEventListener("click", () => {
    const body = isW ? cfg.sample : cfg.reference;
    const extra = (!isW && cfg.keyPoints)
      ? '<div class="mt-s"><b class="small">参考要点</b><ul class="small muted">' + cfg.keyPoints.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul></div>"
      : (isW && cfg.tips ? '<div class="mt-s"><b class="small">写作提示</b><ul class="small muted">' + cfg.tips.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul></div>" : "");
    openModal("<h3>" + (isW ? "参考范文" : "参考译文") + "</h3>" +
      '<div class="passage" style="white-space:pre-wrap">' + esc(body) + "</div>" + extra +
      '<div class="row mt-l"><div class="grow"></div><button class="btn" id="mClose">关闭</button></div>');
    $("#mClose").addEventListener("click", closeModal);
  });
}

async function gradeSubjPractice() {
  const isW = P.kind === "writing";
  const text = ($("#sText").value || "").trim();
  P.text = text;
  if (!text) { toast("请先输入内容再评分"); return; }
  const btn = $("#sGrade");
  btn.disabled = true;
  $("#sResult").innerHTML = '<div class="card center muted small" style="padding:26px">正在评分，请稍候…</div>';
  try {
    let r;
    if (hasAI()) {
      try {
        const ai = isW ? await gradeWritingAI(text, P.cfg) : await gradeTranslationAI(text, P.cfg);
        r = { score: ai.score, notes: [ai.comment].filter(Boolean), strengths: ai.strengths || [], weaknesses: ai.weaknesses || [], ai: true };
      } catch (e) {
        const rr = isW ? gradeWritingRule(text, P.cfg) : gradeTranslationRule(text, P.cfg);
        r = { score: rr.score, notes: rr.notes, ai: false, aiError: e.message };
      }
    } else {
      const rr = isW ? gradeWritingRule(text, P.cfg) : gradeTranslationRule(text, P.cfg);
      r = { score: rr.score, notes: rr.notes, ai: false };
    }
    P.result = r;
  } finally { btn.disabled = false; }
  $("#sResult").innerHTML = subjResultHTML();
}

function subjResultHTML() {
  const r = P.result;
  if (!r) return "";
  const isW = P.kind === "writing";
  const full = isW ? 106.5 : 106.5;
  const est = round1(r.score / 15 * full);
  let h = '<div class="card"><div class="row between mid wrap">' +
    "<div><b>本次评分：" + r.score + " / 15</b><div class=\"tiny dim\">折算四级得分约 " + est + " / " + full + "</div></div>" +
    '<span class="pill ' + (r.ai ? "ok" : "plain") + '">' + (r.ai ? "AI 评分" : "本地规则估算") + "</span></div>";
  if (r.aiError) h += '<p class="tiny" style="color:var(--warn);margin-top:8px">AI 调用失败，已回退本地规则：' + esc(r.aiError) + "</p>";
  if (r.notes && r.notes.length) h += '<div class="explain mt-s">' + r.notes.map(n => esc(n)).join("<br>") + "</div>";
  if (r.strengths && r.strengths.length) h += '<div class="mt-s small"><b style="color:var(--ok)">亮点</b><ul class="muted">' + r.strengths.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (r.weaknesses && r.weaknesses.length) h += '<div class="mt-s small"><b style="color:var(--bad)">待改进</b><ul class="muted">' + r.weaknesses.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  h += "</div>";
  return h;
}

/* ---------------------------------------------------------------
   16.2 词汇速记
   --------------------------------------------------------------- */
const WORD_PAGE_SIZE = 10;
function renderWords() {
  const total = Math.ceil(WORDS.length / WORD_PAGE_SIZE);
  const cur = Math.min(Math.max(0, S.wordPage | 0), total - 1);
  let h = '<div class="card"><div class="card-title">🔤 高频词速记 · 共 ' + WORDS.length + " 词</div>" +
    '<div class="row wrap mt-s"><input class="input" id="wSearch" placeholder="搜索单词或中文释义…" style="max-width:280px">' +
    '<button class="btn sm" id="wShuffle">随机抽 5 词测验</button>' +
    '<span class="tiny dim" style="align-self:center">点击卡片可查看音标、英文释义与例句</span></div></div>';
  h += '<div class="grid g2 mt" id="wGrid">' + WORDS.map((w, i) => wordCard(w, i)).join("") + "</div>";
  h += '<div class="card mt empty" id="wNone" style="display:none">没有找到匹配的单词。</div>';
  h += '<div class="row between mid mt-s" id="wPager">' +
    '<span class="tiny dim">共 ' + total + ' 页 · 每页 ' + WORD_PAGE_SIZE + ' 词，第 <b id="wPageNo">' + (cur + 1) + "</b> 页</span>" +
    '<span class="row" style="gap:8px">' +
    '<button class="btn sm ghost" id="wPrev">← 上一页</button>' +
    '<button class="btn sm ghost" id="wNext">下一页 →</button></span></div>';
  return h;
}

function wordCard(w, i) {
  return '<div class="card" data-wcard="' + i + '" data-page="' + Math.floor(i / WORD_PAGE_SIZE) + '" style="cursor:pointer">' +
    '<div class="row between mid"><b style="font-size:16px">' + esc(w.w) + '</b>' +
    '<button class="btn xs ghost" data-say="' + esc(w.w) + '">🔊</button></div>' +
    '<div class="small muted" style="margin-top:2px">' + esc(w.zh) + "</div>" +

function bindWords(el) {
  const box = $("#wGrid", el);
  if (!box) return;
  const cards = $$("[data-wcard]", box);
  const total = Math.ceil(WORDS.length / WORD_PAGE_SIZE);
  const sp = $("#wSearch", el);
  const prev = $("#wPrev", el), next = $("#wNext", el), no = $("#wPageNo", el), pager = $("#wPager", el);
  const apply = () => {
    const k = (sp ? sp.value : "").trim().toLowerCase();
    const page = Math.min(Math.max(0, S.wordPage | 0), total - 1);
    let shown = 0;
    cards.forEach(c => {
      const i = Number(c.dataset.wcard);
      const hit = !k || WORDS[i].w.toLowerCase().includes(k) || WORDS[i].zh.includes(k);
      const ok = hit && (k || Number(c.dataset.page) === page);
      c.style.display = ok ? "" : "none";
      if (ok) shown++;
    });
    const none = $("#wNone", el);
    if (none) none.style.display = shown ? "none" : "";
    if (pager) pager.style.display = k ? "none" : "";
    if (no) no.textContent = page + 1;
    if (prev) prev.disabled = page <= 0;
    if (next) next.disabled = page >= total - 1;
  };
  cards.forEach(c => {
    const i = Number(c.dataset.wcard);
    const say = $("[data-say]", c);
    if (say) say.addEventListener("click", ev => { ev.stopPropagation(); speakParts([WORDS[i].w]); });
    c.addEventListener("click", () => loadWordDetail(i, c));
  });
  if (sp) sp.addEventListener("input", apply);
  if (prev) prev.addEventListener("click", () => { S.wordPage = Math.max(0, (S.wordPage | 0) - 1); save(); apply(); });
  if (next) next.addEventListener("click", () => { S.wordPage = Math.min(total - 1, (S.wordPage | 0) + 1); save(); apply(); });
  apply();
  const sh = $("#wShuffle", el);
  if (sh) sh.addEventListener("click", quizWords);
}

async function loadWordDetail(i, card) {
  const extra = $('[data-extra="' + i + '"]', card);
  if (!extra) return;
  if (extra.dataset.loaded === "1") { extra.innerHTML = ""; extra.dataset.loaded = ""; return; }
  extra.innerHTML = '<span class="dim">正在查询网络词典…</span>';
  try {
    const data = await lookupDict(WORDS[i].w);
    const e = data[0] || {};
    const ph = e.phonetic || (e.phonetics || []).map(p => p.text).filter(Boolean)[0] || "";
    const mean = (e.meanings || [])[0] || {};
    const def = (mean.definitions || [])[0] || {};
    let h = "";
    if (ph) h += '<div><b>' + esc(ph) + "</b></div>";
    if (mean.partOfSpeech) h += '<div>' + esc(mean.partOfSpeech) + ". " + esc(def.definition || "") + "</div>";
    if (def.example) h += '<div class="dim" style="font-style:italic">e.g. ' + esc(def.example) + "</div>";
    if (!h) h = '<span class="dim">词典未返回详情。</span>';
    extra.innerHTML = h;
    extra.dataset.loaded = "1";
  } catch (err) {
    extra.innerHTML = '<span style="color:var(--warn)">网络词典查询失败（' + esc(err.message) + '），请检查网络后重试。</span>';
  }
}

function quizWords() {
  const pool = WORDS.slice().sort(() => Math.random() - 0.5).slice(0, 5);
  const qs = pool.map(p => {
    const others = WORDS.filter(x => x.w !== p.w).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.zh);
    const opts = others.concat([p.zh]).sort(() => Math.random() - 0.5);
    return { stem: "单词 " + p.w + " 的意思是？", opts: opts, ans: opts.indexOf(p.zh) };
  });
  P = { mod: "vocabulary", kind: "obj", items: qs.map(q => ({ q: q, g: {} })), idx: 0, picked: null, revealed: false, correct: 0, answered: 0, quiz: true };
  renderPractice();
}

function bindWrong(el) {

    S.wrong = []; save(); renderPractice();
  });
  const eb = $("#wbExport", el);
  if (eb) eb.addEventListener("click", () => {
    const lines = S.wrong.map((it, i) =>
      "#" + (i + 1) + " [" + (BANK_LABEL[it.mod] || "") + " " + (it.from || "") + " " + (it.date || "") + "]\n" +
      it.stem + "\n" + (it.opts || []).map((o, oi) => "  " + String.fromCharCode(65 + oi) + ". " + o).join("\n") +
      "\n  你的答案：" + (it.picked >= 0 ? String.fromCharCode(65 + it.picked) : "未作答") +
      "  正确答案：" + String.fromCharCode(it.ans) + "\n  解析：" + (it.exp || "") + "\n");
    downloadText("CET4-错题本-" + today() + ".txt", lines.join("\n"));
  });
  $$("[data-del]", el).forEach(b => b.addEventListener("click", () => {
    S.wrong = S.wrong.filter(x => x.id !== b.dataset.del);
    save(); renderPractice();
  }));
}

function downloadText(name, text, mime) {
  const type = mime || "text/plain;charset=utf-8";
  const head = type.indexOf("json") >= 0 ? "" : "\ufeff";
  const blob = new Blob([head + text], { type: type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";

  ta.select();

  if (done) done();
}

/* ---------------------------------------------------------------
   18.5 AI 题库更新（调用已接入的 AI 接口扩充与完善题库）
   --------------------------------------------------------------- */
const AI_MODS = [
  { id: "listening", name: "听力", icon: "🎧" },
  { id: "reading", name: "阅读", icon: "📖" },
  { id: "vocabulary", name: "词汇", icon: "🔤" },
  { id: "writing", name: "写作", icon: "✍️" },
  { id: "translation", name: "翻译", icon: "🔄" }
];
let AIMods = ["listening", "reading", "vocabulary"];
let AICount = 2;
let AIPolish = false;
let AIRun = null;
let aiBusy = false;

function aiModName(id) {
  if (id === "polish") return "解析优化";
  const m = AI_MODS.find(x => x.id === id);
  return m ? m.name : (BANK_LABEL[id] || "题目");
}
function aiBankArr(mod) { return (S && S.aiBank && S.aiBank[mod]) || []; }

// 合并题库：内置题库 + AI 生成题库（AI 题追加在后）
function bankOf(mod) { return (BANK[mod] || []).concat(aiBankArr(mod)); }

// 统计“题目条数”：听力/阅读按小题计，词汇按题计，写作/翻译按题计
function countQ(mod, arr) {
  const subj = (mod === "writing" || mod === "translation");
  return (arr || []).reduce((a, g) => a + (subj
    ? (g && g.prompt ? 1 : 0)
    : (g && g.questions ? g.questions.length : (g && g.stem ? 1 : 0))), 0);
}
function aiBankStats() {
  const r = { groups: 0, questions: 0, byMod: {} };
  AI_MODS.forEach(m => {
    const arr = aiBankArr(m.id);
    const q = countQ(m.id, arr);
    r.byMod[m.id] = { groups: arr.length, questions: q };
    r.groups += arr.length;
    r.questions += q;
  });
  return r;
}
function aiNoteCount() { return Object.keys(S.aiNotes || {}).length; }

// 题干归一化：用于查重与“AI 解析”匹配
function normStem(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/_{2,}/g, " ")
    .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, " ")
    .trim();
}
// 解析优先使用 AI 优化版本（更长者胜出）
function qExp(q) {
  if (!q) return "暂无解析";
  const raw = String(q.exp || "").trim();
  const ai = (S && S.aiNotes) ? S.aiNotes[normStem(q.stem)] : "";
  if (ai && ai.length > raw.length) return ai;
  return raw || "暂无解析";
}

/* ---------- 从模型输出中提取并严格校验 JSON ---------- */
function extractJSON(text) {
  let t = String(text || "").trim();
  t = t.replace(/^```[a-zA-Z]*\s*/, "").replace(/```\s*$/, "").trim();
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s < 0 || e <= s) throw new Error("返回内容不是 JSON 对象");
  try { return JSON.parse(t.slice(s, e + 1)); }
  catch (err) { throw new Error("JSON 解析失败：" + String(err.message).slice(0, 60)); }
}

function pickChoice(q, seen, existing) {
  if (!q || typeof q !== "object") return null;
  const stem = String(q.stem || "").trim();
  if (stem.length < 8) return null;
  const opts = (Array.isArray(q.opts) ? q.opts : []).map(o => String(o == null ? "" : o).trim());
  if (opts.length < 3 || opts.some(o => !o)) return null;
  if (new Set(opts.map(o => o.toLowerCase())).size !== opts.length) return null;
  const ans = Number(q.ans);
  if (!Number.isInteger(ans) || ans < 0 || ans >= opts.length) return null;
  const key = normStem(stem);
  if (!key || seen.has(key) || existing.has(key)) return null;
  seen.add(key);
  return { stem: stem, opts: opts.slice(0, 6), ans: ans, exp: String(q.exp || "").trim(), ai: true };
}

function pickGroup(mod, g, seen, existing) {
  if (!g || typeof g !== "object") return null;
  if (mod === "listening") {
    const script = String(g.script || "").trim();
    if (script.split(/\s+/).filter(Boolean).length < 40) return null;
    const qs = (Array.isArray(g.questions) ? g.questions : []).map(q => pickChoice(q, seen, existing)).filter(Boolean);
    if (qs.length < 2) return null;
    return { title: String(g.title || "AI 生成 · 听力训练").trim().slice(0, 60), script: script, questions: qs, ai: true };
  }
  if (mod === "reading") {
    const passage = String(g.passage || "").trim();
    if (passage.split(/\s+/).filter(Boolean).length < 90) return null;
    const qs = (Array.isArray(g.questions) ? g.questions : []).map(q => pickChoice(q, seen, existing)).filter(Boolean);
    if (qs.length < 2) return null;
    return { title: String(g.title || "AI 生成 · 仔细阅读").trim().slice(0, 60), passage: passage, questions: qs, ai: true };
  }
  if (mod === "writing") {
    const prompt = String(g.prompt || "").trim();
    const sample = String(g.sample || "").trim();
    if (prompt.length < 40) return null;
    if (sample.split(/\s+/).filter(Boolean).length < 60) return null;
    const key = normStem(prompt).slice(0, 80);
    if (!key || seen.has(key) || existing.has(key)) return null;
    seen.add(key);
    let minW = Number(g.minWords) || 120, maxW = Number(g.maxWords) || 180;
    if (!(minW > 0) || !(maxW > minW)) { minW = 120; maxW = 180; }
    return {
      prompt: prompt, minWords: Math.round(minW), maxWords: Math.round(maxW), sample: sample,
      tips: (Array.isArray(g.tips) ? g.tips : []).map(t => String(t).trim()).filter(Boolean).slice(0, 6), ai: true
    };
  }
  if (mod === "translation") {
    const prompt = String(g.prompt || "").trim();
    const reference = String(g.reference || "").trim();
    if (prompt.replace(/[^\u4e00-\u9fa5]/g, "").length < 30) return null;
    if (reference.split(/\s+/).filter(Boolean).length < 40) return null;
    const key = normStem(prompt).slice(0, 80);
    if (!key || seen.has(key) || existing.has(key)) return null;
    seen.add(key);
    return {
      prompt: prompt, reference: reference,
      keyPoints: (Array.isArray(g.keyPoints) ? g.keyPoints : []).map(t => String(t).trim()).filter(Boolean).slice(0, 6), ai: true
    };
  }
  return null;
}

// 已有题库的去重键（题干 / 作文题目 / 翻译原文）
function existingKeys(mod) {
  const set = new Set();
  bankOf(mod).forEach(g => {
    if (!g) return;
    if (g.questions) g.questions.forEach(q => { const k = normStem(q.stem); if (k) set.add(k); });
    else if (g.stem) { const k = normStem(g.stem); if (k) set.add(k); }
    else if (g.prompt) { const k = normStem(g.prompt).slice(0, 80); if (k) set.add(k); }
  });
  return set;
}

function validateAIItems(mod, list) {
  const seen = new Set();
  const existing = existingKeys(mod);
  const items = [];
  let skipped = 0;
  (Array.isArray(list) ? list : []).forEach(raw => {
    const ok = (mod === "vocabulary") ? pickChoice(raw, seen, existing) : pickGroup(mod, raw, seen, existing);
    if (ok) items.push(ok); else skipped++;
  });
  return { items: items, skipped: skipped };
}

/* ---------- 提示词构造 ---------- */
function avoidText(mod, n) {
  const keys = Array.from(existingKeys(mod)).slice(0, n || 30);
  return keys.map(k => "- " + k.slice(0, 70)).join("\n");
}

function aiUpdateMessages(mod, count) {
  let need = "", schema = "";
  if (mod === "listening") {
    need = "请生成 " + count + " 组全新的大学英语四级听力训练材料（短对话或短篇新闻），每组 2 道题。";
    schema = '{"items":[{"title":"组的标题（中文）","script":"80–130 词的英文听力原文","questions":[{"stem":"英文题干","opts":["选项A","选项B","选项C","选项D"],"ans":0,"exp":"中文解析，并引用原文关键句"}]}]}';
  } else if (mod === "reading") {
    need = "请生成 " + count + " 篇全新的四级仔细阅读材料，每篇 3 道题。";
    schema = '{"items":[{"title":"篇的标题（中文）","passage":"180–260 词的英文短文","questions":[{"stem":"英文题干","opts":["选项A","选项B","选项C","选项D"],"ans":0,"exp":"中文解析，并引用原文依据"}]}]}';
  } else if (mod === "vocabulary") {
    need = "请生成 " + count + " 道全新的四级词汇与固定搭配选择题。";
    schema = '{"items":[{"stem":"题干，用 ___ 表示空格","opts":["选项A","选项B","选项C","选项D"],"ans":0,"exp":"中文解析：正确词义与搭配，并说明其他选项为何不合适"}]}';
  } else if (mod === "writing") {
    need = "请生成 " + count + " 道全新的四级写作题目（附参考范文与中文写作提示）。";
    schema = '{"items":[{"prompt":"Directions: 英文作文题目，含字数要求","minWords":120,"maxWords":180,"sample":"140–170 词的英文参考范文","tips":["中文写作提示 1","中文写作提示 2"]}]}';
  } else {
    need = "请生成 " + count + " 道全新的四级汉译英题目（附参考译文与要点）。";
    schema = '{"items":[{"prompt":"一段 120–160 字的中文段落（文化/社会/科技主题）","reference":"对应的英文参考译文","keyPoints":["中文要点：英文表达"]}]}';
  }
  const rules = [
    "只输出一个 JSON 对象，不要 Markdown 代码块、不要解释、不要任何多余文字。",
    "结构必须严格为：" + schema,
    "客观题每题 4 个选项、只有 1 个正确答案，ans 为正确选项下标（0 表示第一个选项）。",
    "干扰项必须与题干相关但不能也正确；同一题内选项不得重复。",
    "语言难度贴近四级真题，用词常见，避免生僻词与超纲内容。",
    "解析用中文，写得具体（说明依据、搭配或干扰项问题）。"
  ].join("\n");
  const avoid = avoidText(mod);
  return [
    { role: "system", content: "你是大学英语四级（CET-4）资深命题专家，只输出严格合法的 JSON。" },
    {
      role: "user",
      content: need + "\n输出要求：\n" + rules +
        (avoid ? "\n注意：不要与下列已有题目重复（题干或话题）：\n" + avoid : "")
    }
  ];
}

function polishMessages(batch) {
  const payload = batch.map((x, i) => ({
    n: i + 1, mod: aiModName(x.mod), stem: x.q.stem,
    opts: x.q.opts || [], ans: x.q.ans, oldExp: String(x.q.exp || "")
  }));
  return [
    { role: "system", content: "你是大学英语四级（CET-4）英语教师，只输出严格合法的 JSON。" },
    {
      role: "user",
      content: "下面给出若干道四级客观题。请为每题重写一段更详细、更有教学价值的中文解析。" +
        "\n要求：1) 说明正确答案的依据（听力/阅读要点出原文关键句或信息，词汇题说明词义与搭配）；" +
        "2) 扼要说明主要干扰项为何不对；3) 每题解析 60–160 字；4) stem 必须与输入原文完全一致，不要改写。" +
        '\n只输出 JSON：{"notes":[{"stem":"原题干原文","exp":"新的中文解析"}]}' +
        "\n\n题目：" + JSON.stringify(payload)
    }
  ];
}
/* ---------- 更新流程 ---------- */
async function runBankUpdate() {
  if (aiBusy) return;
  if (!hasAI()) { toast("请先在「设置」中配置 AI 接口与 API Key"); go("settings"); return; }
  const mods = AIMods.slice();
  if (!mods.length) { toast("请至少选择一个更新范围"); return; }
  const count = clamp(Number(AICount) || 1, 1, 5);
  const polish = AIPolish;

  aiBusy = true;
  AIRun = { running: true, total: mods.length, index: 0, currentMod: mods[0], log: [], note: "" };
  rerenderAIBank();

  let addedQ = 0, addedG = 0, failed = 0;
  for (let i = 0; i < mods.length; i++) {
    const mod = mods[i];
    AIRun.index = i; AIRun.currentMod = mod; AIRun.note = "";
    rerenderAIBank();
    try {
      const txt = await callAI(aiUpdateMessages(mod, count), { temperature: 0.7, timeout: 180000 });
      const raw = extractJSON(txt);
      const list = Array.isArray(raw) ? raw : (Array.isArray(raw.items) ? raw.items : []);
      const res = validateAIItems(mod, list);
      if (!res.items.length) throw new Error("生成内容未通过校验（结构不合法、选项无效或与现有题目重复）");
      S.aiBank[mod] = aiBankArr(mod).concat(res.items);
      const q = countQ(mod, res.items);
      addedQ += q; addedG += res.items.length;
      AIRun.log.push({ mod: mod, ok: true, added: q, groups: res.items.length, skipped: res.skipped });
      save();
    } catch (e) {
      failed++;
      AIRun.log.push({ mod: mod, ok: false, msg: (e && e.message) || String(e) });
    }
    rerenderAIBank();
  }

  if (polish) {
    AIRun.note = "准备优化解析…";
    rerenderAIBank();
    try {
      AIRun.polished = await runPolish(mods);
    } catch (e) {
      AIRun.log.push({ mod: "polish", ok: false, msg: (e && e.message) || String(e) });
    }
  }

  AIRun.running = false;
  AIRun.note = "";
  aiBusy = false;
  S.aiUpdates.unshift({
    date: today(), time: new Date().toTimeString().slice(0, 5),
    mods: mods.slice(), added: addedQ, groups: addedG, failed: failed, polished: AIRun.polished || 0
  });
  S.aiUpdates = S.aiUpdates.slice(0, 20);
  save();
  rerenderAIBank();
  toast(addedQ
    ? "题库已更新：新增 " + addedQ + " 道题" + (AIRun.polished ? "，优化 " + AIRun.polished + " 条解析" : "")
    : "本次未新增题目，请查看更新日志");
}

// 用 AI 重写现有题目解析（更详细），写入 S.aiNotes 而不改动内置题库
async function runPolish(mods) {
  const targets = [];
  mods.forEach(mod => {
    bankOf(mod).forEach(g => {
      if (g && g.questions) g.questions.forEach(q => targets.push({ mod: mod, q: q }));
      else if (g && g.stem) targets.push({ mod: mod, q: g });
    });
  });
  const picked = targets.filter(x => {
    const cur = (S.aiNotes && S.aiNotes[normStem(x.q.stem)]) || "";
    return cur.length < String(x.q.exp || "").length + 20;
  }).slice(0, 24);
  if (!picked.length) {
    AIRun.log.push({ mod: "polish", ok: true, added: 0, note: "现有题目解析已足够详细，无需重写" });
    rerenderAIBank();
    return 0;
  }
  let total = 0;
  for (let i = 0; i < picked.length; i += 6) {
    const batch = picked.slice(i, i + 6);
    AIRun.note = "正在优化解析（" + Math.min(i + 6, picked.length) + "/" + picked.length + "）";
    rerenderAIBank();
    const txt = await callAI(polishMessages(batch), { temperature: 0.4, timeout: 120000 });
    const raw = extractJSON(txt);
    const notes = Array.isArray(raw.notes) ? raw.notes : [];
    let hit = 0;
    notes.forEach(nt => {
      const k = normStem(nt && nt.stem);
      const v = String((nt && nt.exp) || "").trim();
      if (k && v.length >= 20) { S.aiNotes[k] = v; hit++; }
    });
    total += hit;
    save();
    AIRun.log.push({ mod: "polish", ok: true, added: 0, note: "解析优化成功 " + hit + "/" + batch.length + " 题" });
    rerenderAIBank();
  }
  return total;
}

function clearAIExtras() {
  const st = aiBankStats();
  const notes = aiNoteCount();
  if (!st.questions && !notes) { toast("当前没有 AI 生成的内容"); return; }
  if (!confirm("确定清空全部 AI 生成内容吗？\n将删除 " + st.questions + " 道 AI 题目与 " + notes + " 条 AI 优化解析，内置题库不受影响。")) return;
  S.aiBank = clone(DEFAULT_STATE.aiBank);
  S.aiNotes = {};
  save();
  rerenderAIBank();
  toast("已清空 AI 生成内容");
}

async function loadBankData() {
  let b = null;
  try { b = JSON.parse(localStorage.getItem(BANK_CACHE_KEY) || "null"); } catch (e) { b = null; }
  if (!b || !b.diag || !b.practice || !Array.isArray(b.words)) {
    const r = await api("/api/bank");
    if (r.status === 200 && r.data && r.data.data) {
      b = r.data.data;
      try { localStorage.setItem(BANK_CACHE_KEY, JSON.stringify(b)); } catch (e) { /* 忽略 */ }
    }
  }
  if (!b) return false;
  DIAG = b.diag || {};
  WORDS = Array.isArray(b.words) ? b.words : [];
  BANK = b.practice || {};
  return !!(DIAG.listening && DIAG.reading && DIAG.writing && DIAG.translation && WORDS.length);
}

async function bootstrapAuth() {
  const v = await api("/api/verify");
  if (v.status === 401) { gotoLogin(); return false; }
  if (v.status !== 200) return false;
  const u = await api("/api/user");
  if (u.status === 401) { gotoLogin(); return false; }
  if (u.status === 200 && u.data && u.data.data) CLOUD.me = u.data.data;
  // 初始密码未修改：服务端会拒绝一切业务数据，前端直接进强制改密
  if (CLOUD.me && CLOUD.me.mustChangePassword) return "mustChange";
  await pullState();
  return true;
}

async function pullState() {
  const local = loadState();
  const r = await api("/api/state");
  if (r.status === 401) { gotoLogin(); return; }
  const d = (r.data && r.data.data) || {};
  CLOUD.version = d.version || 0;
  const hasServer = !!(d.payload && Object.keys(d.payload).length);
  if (!hasServer) {
    S = local;
    if (local.__hasLocal) cloudPush(true);
    return;
  }
  const server = normalizeState(d.payload);
  const localTs = local.__hasLocal ? (local.savedAt || 0) : 0;
  const serverTs = Date.parse(d.updatedAt || "") || 0;
  if (localTs && localTs > serverTs + 1500) {
    S = local;
    CLOUD.conflict = { version: CLOUD.version, payload: d.payload };
    return;
  }
  S = server;
  // API Key 只留在本机，云端为空时用本地补齐
  if (!S.settings.apiKey && local.settings && local.settings.apiKey) S.settings.apiKey = local.settings.apiKey;
  saveLocal();
}

function mustChangePasswordScreen() {
  const name = esc((CLOUD.me && CLOUD.me.username) || "");
  const inputStyle = "width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin-bottom:14px;outline:none";
  document.body.innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,-apple-system,sans-serif;padding:24px">' +
      '<form id="forcePwdForm" style="width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.35)">' +
        '<h2 style="margin:0 0 8px;font-size:19px;color:#0f172a">请先修改初始密码</h2>' +
        '<p style="margin:0 0 18px;font-size:13px;line-height:1.7;color:#64748b">账号 <b>' + name + '</b> 仍在使用初始密码。修改后才能使用其他功能，修改后需重新登录。</p>' +
        '<label style="display:block;font-size:13px;color:#334155;margin-bottom:6px">当前密码</label>' +
        '<input id="fpOld" type="password" autocomplete="current-password" style="' + inputStyle + '">' +
        '<label style="display:block;font-size:13px;color:#334155;margin-bottom:6px">新密码（至少 8 位，含字母和数字）</label>' +
        '<input id="fpNew" type="password" autocomplete="new-password" style="' + inputStyle + '">' +
        '<label style="display:block;font-size:13px;color:#334155;margin-bottom:6px">确认新密码</label>' +
        '<input id="fpNew2" type="password" autocomplete="new-password" style="' + inputStyle + '">' +
        '<div id="fpMsg" style="min-height:20px;font-size:13px;color:#dc2626;margin-bottom:10px"></div>' +
        '<button type="submit" id="fpBtn" style="width:100%;padding:11px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:14px;cursor:pointer">修改并重新登录</button>' +
      '</form>' +
    '</div>';

  const $f = document.getElementById("forcePwdForm");
  const msg = document.getElementById("fpMsg");
  $f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const oldPwd = document.getElementById("fpOld").value;
    const newPwd = document.getElementById("fpNew").value;
    const again = document.getElementById("fpNew2").value;
    msg.style.color = "#dc2626";
    if (!oldPwd || !newPwd) { msg.textContent = "请填写当前密码与新密码"; return; }
    if (newPwd.length < 8) { msg.textContent = "新密码至少 8 位"; return; }
    if (!/[A-Za-z]/.test(newPwd) || !/\d/.test(newPwd)) { msg.textContent = "新密码需同时包含字母和数字"; return; }
    if (newPwd !== again) { msg.textContent = "两次输入的新密码不一致"; return; }
    if (newPwd === oldPwd) { msg.textContent = "新密码不能与当前密码相同"; return; }

    const btn = document.getElementById("fpBtn");
    btn.disabled = true; btn.textContent = "提交中…";
    let r;
    try {
      r = await api("/api/change-password", { method: "POST", body: { oldPassword: oldPwd, newPassword: newPwd } });
    } catch (e) {
      r = { status: 0, data: null };
    }
    if (r.status === 200) {
      setToken("");
      location.replace("login.html?changed=1");
      return;
    }
    btn.disabled = false; btn.textContent = "修改并重新登录";
    const m = (r.data && r.data.message) || "";
    if (m.indexOf("原密码") >= 0) { msg.textContent = "当前密码不正确"; return; }
    if (r.status === 401) { location.replace("login.html?next=" + encodeURIComponent(location.pathname)); return; }
    msg.textContent = m || "修改失败，请稍后重试";
  });
}

async function init() {
  if (!CONFIG_READY) { configErrorScreen(); return; }
  let ok = false;
  try { ok = await bootstrapAuth(); } catch (e) { ok = false; }
  if (ok === "mustChange") { mustChangePasswordScreen(); return; }
  if (!ok) { bankErrorScreen(); return; }

  if (!(await loadBankData())) { bankErrorScreen(); return; }

  S = S || loadState();
  S.skin = normalizeSkin(S);
  buildNav();
  applySkin();
  $("#modal").addEventListener("click", ev => { if (ev.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") closeModal();
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && /^[1-3]$/.test(ev.key)) {
      ev.preventDefault();
      setSkin(SKINS[Number(ev.key) - 1].id);
    }
  });
  go((location.hash || "").replace("#", "") || "home");
  window.addEventListener("hashchange", () => {
    const h = (location.hash || "").replace("#", "");
    if (ROUTES.some(r => r.id === parseRoute(h).id)) go(h);
  });
  setSyncBadge("saved");
  if (CLOUD.conflict) askConflict();
}
document.addEventListener("DOMContentLoaded", init);
</script>
